 đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Tôm sú nướng muối tiêu nhạt (nướng giấy bạc)", "Tôm sú, dầu oliu, tỏi, tiêu, chanh, giấy bạc", "5-6 con", "7-8 con", "9-10 con", "Canxi & Astaxanthin: Nướng giấy bạc giữ nước, tôm chín mềm, không khét. Tôm cho canxi, kẽm, i-ốt; sắc tố astaxanthin chống oxy hoá bảo vệ tế bào sụn. Nêm rất ít muối. Món vui cho bữa trưa Chủ nhật."], [2, "Đậu phụ sốt cà chua (đậu hấp, không chiên)", "Đậu phụ, cà chua, hành lá, tỏi, dầu oliu", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Canxi thực vật: Đậu phụ cho đạm thực vật, canxi (nếu đông bằng nigari/thạch cao), isoflavone và magie — phần 30% đạm thực vật trong nguyên tắc 70/30. Hấp hoặc nấu trực tiếp với sốt cà, không chiên để tránh dầu."], [2, "Canh rau ngót nấu thịt nạc băm", "Rau ngót, thịt nạc băm, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin C & Canxi thực vật: Rau ngót là rau giàu đạm thực vật, canxi, vitamin C và K — tốt cho xương và miễn dịch. Thịt nạc băm cho đạm. Canh quen thuộc, nấu nhạt."], [2, "Cải bó xôi xào tỏi (xào nhanh, ít dầu)", "Cải bó xôi, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 & Magie: Cải bó xôi cực giàu vitamin K, magie, sắt, folate — K khoá canxi vào xương, magie ru ngủ. Xào tỏi nhanh ít dầu. Rau xanh đậm là bắt buộc trong bữa tối."], [2, "Hồng giòn (gọt vỏ, ăn tươi)", "Hồng giòn Đà Lạt/Mộc Châu cuối vụ, chọn quả đã hết chát", "100g", "150g", "200g", "Beta-caroten & Mangan: Hồng giòn cuối thu giàu beta-caroten (tiền vitamin A) bảo vệ mắt, niêm mạc hô hấp mùa lạnh; mangan tham gia tạo sụn và collagen xương. Ăn lượng vừa phải vì hồng có tannin — không ăn lúc đói."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạt óc chó (bóc sẵn, ăn với sữa)", "Óc chó nguyên hạt, không muối, không tẩm đường", "3-5 hạt", "5-8 hạt", "8-10 hạt", "DHA/EPA thực vật: Óc chó là hạt giàu omega-3 (ALA) nhất, hỗ trợ phát triển não và giảm viêm ở đầu xương. Kèm magie, kẽm và đồng — bộ khoáng cho tạo xương. Nhai kỹ từng hạt; bé nhỏ nên bẻ nhỏ để tránh hóc."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Cá hồi áp chảo da giòn (ít dầu oliu)", "Cá hồi Sa Pa/Na Uy phi lê, dầu oliu, tiêu, chanh", "60g", "80g", "100g", "Vitamin D3 từ cá béo & Omega-3: Cá hồi là 'vua D3' trong thực phẩm — D3 là 'xe tải' chở canxi từ ruột vào máu. Omega-3 EPA/DHA giảm viêm đầu xương, nuôi não. Áp chảo chỉ 1 thìa dầu, không chiên ngập. 2 bữa cá béo/tuần là mục tiêu."], [4, "Cải xanh luộc chấm mè rang", "Cải xanh (cải bẹ), mè rang", "100g", "150g", "200g", "Vitamin K2 (MK7) kép: Cải xanh đậm + mè rang — hai nguồn K2 trong một đĩa, đưa canxi từ các bữa trong ngày gắn vào xương trong lúc ngủ. Luộc nhanh giữ màu."], [4, "Canh cua đồng mồng tơi mướp", "Cua đồng giã lọc, mồng tơi, mướp hương, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie ru ngủ: Cua đồng + mồng tơi là 'cặp đôi magie' kinh điển — magie giúp giãn cơ, ngủ sâu, kích hoạt vitamin D và dẫn canxi vào xương. Cua đồng còn cho canxi tự nhiên rất cao. Bát canh tối hoàn hảo cho GH tiết mạnh 22h-2h."], [4, "Trứng cút luộc (3-5 quả)", "Trứng cút, luộc chín", "3 quả", "4 quả", "5 quả", "Vitamin D3 & Choline: Trứng cút nhỏ nhưng giàu D3, B12, choline, sắt. Luộc chín, dễ ăn. Món phụ tối góp D3 cho 'xe tải' chở canxi."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm hoàn chỉnh & Lutein: Trứng cung cấp đạm dễ tiêu, lutein và zeaxanthin bảo vệ mắt cho con học bài, xem bảng. Lòng đỏ giàu vitamin A, B12, selen hỗ trợ tăng trưởng và miễn dịch mùa gió mùa Đông Bắc. Nhai kỹ, ăn chậm để hấp thu tối đa."], [0, "Cháo cá lóc rau đắng (cá hấp gỡ xương)", "Cá lóc hấp gỡ xương, gạo tẻ, rau đắng/rau cải, gừng, hành", "1 bát", "1 bát đầy", "1.5 bát", "Đạm trắng & Vitamin B: Cá lóc miền Tây cho đạm trắng dễ tiêu, ít mỡ, giàu B12 và selen. Hấp rồi gỡ xương — không chiên. Gừng ấm bụng ngày lạnh. Món cháo nhẹ, hợp bé đang ốm dậy hoặc bé kén ăn."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Gà ta luộc xé phay trộn rau răm (ít muối)", "Gà ta luộc, hành tây, rau răm, chanh, tiêu", "50g", "70g", "90g", "Đạm nạc & B6: Gà ta luộc xé là đạm nạc hoàn chỉnh, B6 giúp chuyển hoá đạm thành mô. Trộn hành tây, rau răm, chanh — không dầu, ít muối. Nước luộc gà dùng nấu canh để không bỏ phí glycine."], [2, "Natto (đậu tương lên men) trộn xì dầu, hành", "Natto Nhật, xì dầu ít muối, hành lá, chút mù tạt (bé lớn)", "1/2 hộp", "1 hộp", "1 hộp", "Vitamin K2 (MK7): Natto là thực phẩm giàu K2-MK7 nhất thế giới — 1 hộp nhỏ cho lượng K2 gấp hàng chục lần phô mai. K2 là 'người lái xe' đưa canxi gắn thẳng vào xương. Tập cho con ăn từ nửa hộp, trộn cơm nóng."], [2, "Canh bí đỏ nấu tôm tươi", "Bí đỏ, tôm tươi băm, hành lá", "1 chén", "1 tô nhỏ", "1 tô vừa", "Beta-caroten & Magie: Bí đỏ cho beta-caroten, kali, magie; tôm cho canxi, kẽm. Canh ngọt tự nhiên không cần đường. Màu cam hấp dẫn bé nhỏ."], [2, "Cải ngọt xào tỏi", "Cải ngọt, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K & Canxi thực vật: Cải ngọt — rau xanh đậm mùa đông — giàu vitamin K, C, canxi. Xào tỏi nhanh. Cấp K2 cho bữa tối theo nguyên tắc."], [2, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", "Vitamin C & Chất xơ hoà tan: Bưởi Diễn Hà Nội vào chính vụ tháng 11-12, múi khô ráo, ngọt đậm. Chất xơ pectin giúp no lâu, ổn định đường huyết; vitamin C hỗ trợ tạo collagen cho sụn tăng trưởng. Bé dư cân rất nên ăn bưởi thay vì trái cây ngọt đậm."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt điều rang mộc", "Hạt điều Bình Phước rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Siêu Kẽm (Zinc): Hạt điều là hạt giàu kẽm hàng đầu — kẽm kích thích tuyến yên tiết GH và tham gia phân chia tế bào xương. Thêm magie, sắt, đồng. Bữa phụ chiều có hạt điều + sữa tươi là 'combo đánh thức GH' trước giấc ngủ đêm."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá thu nướng giấy bạc gừng hành", "Cá thu khúc, gừng, hành lá, dầu oliu, chanh", "60g", "80g", "100g", "Vitamin D3 từ cá béo: Cá thu nướng giấy bạc giữ trọn D3, omega-3, selen — không khét, không dầu. Buổi tối có cá béo + rau K2 là 'cặp đôi vàng': D3 đưa canxi vào máu, K2 khoá canxi vào xương trong giấc ngủ."], [4, "Súp lơ xanh hấp rưới dầu mè, mè rang", "Súp lơ xanh, dầu mè, mè rang", "100g", "150g", "200g", "Vitamin K2 & Sulforaphane: Súp lơ xanh hấp giữ sulforaphane chống viêm, vitamin K, C; dầu mè + mè rang cho K2 và canxi. Món rau 'vàng' cho xương."], [4, "Canh hến nấu mướp hành", "Hến (Huế), mướp, hành, rau răm", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ hến: Hến rất giàu sắt, magie, kẽm, B12 — nhỏ mà 'có võ'. Nấu mướp ngọt mát. Canh tối giàu magie giúp con ngủ sâu, phòng thiếu máu bé gái."], [4, "Đậu phụ hấp rắc mè rang hành lá", "Đậu phụ, mè rang, hành lá, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & K2 từ mè: Đậu phụ hấp rắc mè rang — đạm thực vật + canxi + K2 trong một món nhẹ. Không chiên. Món phụ tối lý tưởng."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin D3 từ lòng đỏ & Đạm chuẩn: Trứng gà ta là nguồn đạm có giá trị sinh học cao nhất trong tự nhiên, lòng đỏ chứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Bún riêu cua đồng (ít mắm tôm, không chiên đậu)", "Bún, cua đồng giã lọc, cà chua, đậu phụ hấp, rau sống, hành", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Combo Canxi & Magie từ cua đồng: Cua đồng là nguồn canxi tự nhiên dồi dào, kèm magie giúp canxi vào xương đúng chỗ. Cà chua cho lycopene và vitamin C hỗ trợ hấp thu sắt. Đậu phụ hấp thay vì chiên để tránh dầu mỡ bữa sáng."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Bơ chín (dằm với sữa chua)", "Bơ sáp chín, dằm nhuyễn, không thêm đường", "1 hộp", "1 hộp", "1-2 hộp", "Combo Magie & Chất béo tốt: Bơ cung cấp magie, kali và chất béo không bão hoà đơn — 'dung môi' giúp hấp thu vitamin D3, K2, A, E. Không thêm đường hay sữa đặc; trộn với sữa chua không đường là bữa phụ chuẩn cho bé thiếu cân cần thêm năng lượng tốt."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Thịt bò kho cà rốt khoai tây (ninh mềm, ít mắm)", "Bắp bò, cà rốt, khoai tây, hành tây, sả, cà chua", "50g", "70g", "90g", "Sắt Heme & Collagen: Bắp bò ninh mềm cho sắt, kẽm, B12 và collagen từ gân; cà rốt cho beta-caroten. Kho với cà chua và sả thay vì gia vị bò kho gói sẵn (nhiều muối, màu). Bé gái dậy thì cần sắt — món này đúng chỗ."], [2, "Đậu bắp luộc chấm mè rang", "Đậu bắp non, mè rang, muối mè ít muối", "100g", "150g", "200g", "Canxi thực vật & Chất nhầy: Đậu bắp giàu canxi, magie, folate, vitamin K; chất nhầy bảo vệ niêm mạc ruột, giúp hấp thu tốt. Chấm mè rang cho K2 và thêm canxi."], [2, "Canh cải xanh nấu thịt nạc băm gừng", "Cải xanh (cải bẹ), thịt nạc băm, gừng, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K2 (MK7) từ cải xanh đậm: Cải xanh là rau xanh đậm giàu vitamin K, canxi, folate — K giúp khoá canxi vào xương. Gừng làm ấm ngày gió mùa. Thịt nạc băm cho đạm. Canh tối nhẹ, đúng K2."], [2, "Giá đỗ xào hẹ", "Giá đỗ, hẹ, tỏi", "100g", "150g", "200g", "Vitamin C & Enzyme: Giá đỗ giàu vitamin C, enzyme tiêu hoá; hẹ cho vitamin K, allicin kháng khuẩn. Xào nhanh 1 phút. Rau giòn mát cân bằng bữa."], [2, "K ỗ trợ xương trong một món. Hấp không dầu. Hợp bé nhỏ hoặc bé kén ăn thịt."], [4, "Cải chíp xào nấm đông cô", "Cải chíp (cải thìa), nấm đông cô, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin K2 & D2: Cải chíp là cải xanh đậm cho K, canxi; nấm đông cô cho D2 — cặp D-K hỗ trợ canxi. Xào nhanh ít dầu, đúng rau K2 bữa tối."], [4, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [4, "Nấm hương, nấm kim châm xào tỏi", "Nấm hương, nấm kim châm, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin D2 & Beta-glucan: Nấm là nguồn D2 thực vật, beta-glucan tăng đề kháng mùa lạnh. Xào tỏi nhanh. Góp D cho xương, ít calo."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm chuẩn & Choline nuôi não: 1 quả trứng cho ~6-7g đạm hoàn chỉnh với đủ 9 acid amin thiết yếu — nguyên liệu trực tiếp để xây mô xương và sụn. Choline trong lòng đỏ hỗ trợ trí nhớ, giúp con học tập tỉnh táo cả buổi sáng. Ăn trước 7h30 để cortisol không tăng cao, từ sữa, cùng mangan tham gia tổng hợp collagen sụn. Vị bùi, bé dễ ăn; hạn chế 5-10 hạt vì năng lượng cao."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Ếch xào sả nghệ (không ớt)", "Thịt ếch làm sạch, sả, nghệ, hành, tiêu", "60g", "80g", "100g", "Đạm trắng & Canxi: Thịt ếch là đạm trắng rất nạc, giàu canxi, phốt-pho, kali, ít mỡ. Xào sả nghệ thơm, không ớt với bé. Thực phẩm 'lạ' giúp đa dạng tuần đủ 25 loại."], [4, "Rau dền luộc chấm mè rang", "Rau dền đỏ/xanh, mè rang", "100g", "150g", "200g", "Combo Magie & Canxi & Sắt: Rau dền giàu canxi, magie, sắt — bộ ba cho xương và máu. Luộc nhanh, chấm mè rang để thêm K2. Rau tối ưu tiên magie."], [4, "Canh ngao nấu chua cà chua dứa", "Ngao, cà chua, dứa, dọc mùng, thì là, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ ngao: Ngao giàu magie, sắt, B12 — tối ăn ngao giúp ngủ sâu và tạo máu. Cà chua, dứa cho vitamin C hấp thu sắt. Nấu chua nhẹ, không đường, không mì chính."], [4, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin K2 (MK7) & D3 tự nhiên: Lòng đỏ trứng gà ta thả vườn là một trong số ít thực phẩm hàng ngày chứa cả D3 lẫn K2 — D3 giúp ruột hút canxi vào máu, K2 dẫn canxi gắn vào xương. Một quả trứng mỗi sáng là thói quen rẻ nhất nhưng hiệu quả nhất cho chiều cao."], [0, "Bánh mì nguyên cám phết bơ đậu phộng, chuối lát", "Bánh mì nguyên cám, bơ đậu phộng nguyên chất không đường, chuối chín thái lát", "1 lát", "1-2 lát", "2 lát", "Combo Magie & Đạm thực vật: Bơ đậu phộng nguyên chất cho đạm thực vật, magie, vitamin E; chuối cho kali và magie; bánh mì nguyên cám cho tinh bột chậm. Bữa sáng 3 phút cho sáng bận rộn, vẫn đủ 4-2-1 khi kèm trứng và sữa."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Ổi (gọt, cắt miếng, bỏ hạt)", "Ổi Đông Dư/ổi lê giòn", "100g", "150g", "200g", "Vitamin C & Chất xơ: Ổi có hàm lượng vitamin C gấp 4 lần cam, hỗ trợ tổng hợp collagen cho sụn và hấp thu sắt. Giòn, ít đường, nhiều xơ — bé dư cân ăn ổi vừa đã miệng vừa an toàn. Bỏ hạt để tránh táo bón."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Sườn non xào chua ngọt (sốt cà chua tươi, không đường tinh luyện)", "Sườn non chặt miếng, cà chua tươi, dứa, hành tây, tỏi", "60g (~2 dẻ)", "80g (~3 dẻ)", "100g (~4 dẻ)", "Collagen & Vitamin C hỗ trợ: Sườn non cho đạm, collagen và kẽm; vị chua ngọt tự nhiên từ dứa và cà chua thay vì đường — tránh insulin tăng. Xào ít dầu, không chiên sườn trước. Món 'ruột' của bé mà vẫn đúng nguyên tắc."], [2, "Đậu phụ kho nấm rơm (kho nhạt)", "Đậu phụ, nấm rơm, hành, tiêu, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Beta-glucan: Đậu phụ kho với nấm rơm — đạm thực vật và beta-glucan tăng đề kháng. Kho nhạt, không chiên đậu trước. Góp phần 30% đạm thực vật mỗi ngày."], [2, "Canh rong biển đậu phụ nấm", "Rong biển khô, đậu phụ non, nấm kim châm, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "I-ốt & Canxi & Magie: Rong biển giàu i-ốt (cho tuyến giáp — điều hoà tăng trưởng), canxi, magie; đậu phụ cho đạm thực vật; nấm cho D2. Canh kiểu Hàn ấm, ít muối."], [2, "Cải thìa hấp dầu mè tỏi", "Cải thìa, dầu mè, tỏi, xì dầu ít muối", "100g", "150g", "200g", "Vitamin K2 & Canxi: Cải thìa là cải xanh đậm giàu canxi (hấp thu tốt hơn cải bó xôi vì ít oxalat), vitamin K. Hấp rưới dầu mè — K2 cho bữa tối."], [2, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạnh nhân rang mộc", "Hạnh nhân rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Canxi thực vật & Vitamin E: 10 hạt hạnh nhân cho ~30mg canxi và magie — nằm trong 30% canxi thực vật của nguyên tắc 70/30. Vitamin E bảo vệ màng tế bào sụn. Kết hợp sữa tươi tạo bữa phụ chiều đủ đạm-béo tốt."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Ức gà nướng lá chanh (nướng lò, ướp tỏi tiêu)", "Ức gà, lá chanh, tỏi, tiêu, dầu oliu", "50g", "70g", "90g", "Đạm nạc tinh khiết: Ức gà nướng lò ít dầu, ướp lá chanh tỏi thơm, là đạm nạc cho bữa tối — nhiều đạm, ít năng lượng, giúp bé dư cân áp dụng 4-2-0 mà vẫn no. Niacin, B6, selen hỗ trợ chuyển hoá."], [4, "Mồng tơi xào tỏi", "Mồng tơi, tỏi, dầu oliu", "100g", "150g", "200g", "Combo Magie ru ngủ: Mồng tơi giàu magie, canxi, chất nhầy tốt cho ruột. Xào tỏi nhanh. Rau tối chuẩn magie cho giấc ngủ sâu."], [4, "Canh cua đồng rau đay mướp", "Cua đồng, rau đay, mướp, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Canxi: Cua đồng cho canxi tự nhiên cực cao; rau đay cho magie, canxi, chất nhầy tốt cho ruột. Canh tối chuẩn Bắc Bộ, ngủ ngon, xương chắc."], [4, "Trứng cút luộc (3-5 quả)", "Trứng cút, luộc chín", "3 quả", "4 quả", "5 quả", "Vitamin D3 & Choline: Trứng cút nhỏ nhưng giàu D3, B12, choline, sắt. Luộc chín, dễ ăn. Món phụ tối góp D3 cho 'xe tải' chở canxi."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm hoàn chỉnh & Lutein: Trứng cung cấp đạm dễ tiêu, lutein và zeaxanthin bảo vệ mắt cho con học bài, xem bảng. Lòng đỏ giàu vitamin A, B12, selen hỗ trợ tăng trưởng và miễn dịch mùa gió mùa Đông Bắc. Nhai kỹ, ăn chậm để hấp thu tối đa."], [0, "Cháo ngao nấu gừng, hành lá", "Ngao tươi luộc lấy thịt và nước, gạo tẻ, gừng, hành lá", "1 bát", "1 bát đầy", "1.5 bát", "Combo Magie & Sắt từ ngao: Ngao giàu magie, sắt, kẽm, B12 — ít ai ngờ ngao là nguồn sắt tốt hơn cả thịt bò. Nấu cháo với nước luộc ngao ngọt tự nhiên, không cần mì chính. Gừng ấm, chống lạnh bụng mùa gió mùa."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Hồng treo gió (ăn 1-2 quả nhỏ)", "Hồng treo gió Đà Lạt, loại sấy tự nhiên không đường", "1 quả nhỏ", "1-2 quả", "2 quả", "Chất xơ & Kali: Hồng treo gió là đặc sản tháng 11, vị ngọt tự nhiên cô đặc nên chỉ dùng 1-2 quả nhỏ như 'phần thưởng' bữa phụ. Kali giúp cân bằng điện giải, giảm mất canxi qua thận. Ăn kèm sữa chua không đường để giảm tốc độ hấp thu đường."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Cá chép hấp bia-gừng (hấp gừng hành, không bia với bé nhỏ)", "Cá chép, gừng, hành lá, thì là, xì dầu ít muối", "60g", "80g", "100g", "Đạm & Omega-3 nước ngọt: Cá chép giàu đạm, omega-3, vitamin A, D, B. Hấp gừng hành giữ nguyên vị ngọt, không dầu. Gỡ kỹ xương cho bé. Cá nước ngọt Bắc Bộ đổi vị với cá biển."], [2, "Đậu phụ nhồi thịt nấm hấp", "Đậu phụ, thịt nạc băm, nấm mèo, hành, hấp chín", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm 70/30 trong một món: Đậu phụ (thực vật) + thịt nạc (động vật) nhồi hấp — đúng tỉ lệ đạm động-thực vật. Nấm mèo cho sắt và xơ. Hấp không dầu, mềm dễ ăn, bé nhỏ rất thích."], [2, "Canh cải cúc (tần ô) nấu thịt nạc băm", "Cải cúc, thịt nạc băm, gừng, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & Kali từ rau mùa đông: Cải cúc là rau đặc trưng mùa đông Hà Nội, giàu vitamin K, kali, carotenoid, giúp ngủ ngon, giảm ho. Nấu thịt băm nhẹ, ấm người."], [2, "Cải xoăn (kale) xào tỏi dầu oliu", "Cải xoăn, tỏi, dầu oliu, chút chanh", "100g", "150g", "200g", "Vitamin K2 & Canxi thực vật: Cải xoăn là 'siêu rau' giàu vitamin K nhất, canxi hấp thu tốt, lutein. Xào tỏi nhanh, vắt chút chanh. K2 cho bữa tối."], [2, "Táo (ăn cả vỏ, rửa kỹ)", "Táo đỏ/táo xanh giòn", "100g", "150g", "200g", "Pectin & Quercetin: Vỏ táo chứa quercetin chống viêm, pectin ổn định đường huyết. Táo giòn giúp con nhai kỹ, tập thói quen ăn chậm. Bữa phụ nhẹ, không làm con no ngang trước bữa trưa."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt óc chó (bóc sẵn, ăn với sữa)", "Óc chó nguyên hạt, không muối, không tẩm đường", "3-5 hạt", "5-8 hạt", "8-10 hạt", "DHA/EPA thực vật: Óc chó là hạt giàu omega-3 (ALA) nhất, hỗ trợ phát triển não và giảm viêm ở đầu xương. Kèm magie, kẽm và đồng — bộ khoáng cho tạo xương. Nhai kỹ từng hạt; bé nhỏ nên bẻ nhỏ để tránh hóc."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Thịt bò xào cải ngồng (xào lửa lớn, ít dầu)", "Thịt bò thăn, cải ngồng, tỏi, dầu oliu", "50g", "70g", "90g", "Sắt Heme & K2 từ cải xanh đậm: Bò cho sắt, kẽm; cải ngồng mùa đông Hà Nội cho vitamin K, canxi, folate. Vitamin C trong cải giúp hấp thu sắt. Xào nhanh lửa lớn giữ rau xanh giòn."], [4, "Bông cải xanh hấp chấm mè rang", "Bông cải xanh, mè rang giã, chút muối", "100g", "150g", "200g", "Vitamin K2 (MK7) & Canxi thực vật: Bông cải xanh là rau xanh đậm giàu vitamin K, C, canxi; mè rang thêm canxi và K2. Hấp 3-4 phút giữ màu xanh và vitamin. 'Rau + mè' là công thức K2 cho bữa tối."], [4, "Canh cải bó xôi nấu tôm", "Cải bó xôi (rau chân vịt), tôm tươi, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K2 & Magie & Sắt: Cải bó xôi là rau xanh đậm giàu K, magie, sắt, folate; tôm cho canxi, kẽm. Nấu nhanh giữ màu xanh. Đúng tiêu chí 'cải xanh đậm cấp K2' cho bữa tối."], [4, "Đậu phụ hấp rắc mè rang hành lá", "Đậu phụ, mè rang, hành lá, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & K2 từ mè: Đậu phụ hấp rắc mè rang — đạm thực vật + canxi + K2 trong một món nhẹ. Không chiên. Món phụ tối lý tưởng."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin D3 từ lòng đỏ & Đạm chuẩn: Trứng gà ta là nguồn đạm có giá trị sinh học cao nhất trong tự nhiên, lòng đỏ chứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Xôi đậu xanh ruốc (xôi ít mỡ, không hành phi dầu)", "Gạo nếp, đậu xanh cà vỏ, ruốc thịt nạc tự làm, chút mè rang", "1 bát nhỏ", "1 bát", "1 bát đầy", "Đạm thực vật & Tinh bột: Đậu xanh cho đạm thực vật, magie, B1; gạo nếp cho năng lượng bền cho buổi sáng lạnh. Rắc mè rang để thêm canxi và K2. Chỉ dùng 1 lần/tuần vì nếp no lâu; kèm trứng luộc và sữa để cân đối đạm."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", "Vitamin C & Chất xơ hoà tan: Bưởi Diễn Hà Nội vào chính vụ tháng 11-12, múi khô ráo, ngọt đậm. Chất xơ pectin giúp no lâu, ổn định đường huyết; vitamin C hỗ trợ tạo collagen cho sụn tăng trưởng. Bé dư cân rất nên ăn bưởi thay vì trái cây ngọt đậm."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Tôm hấp nước dừa sả", "Tôm sú, nước dừa, sả, hành lá", "5-6 con", "7-8 con", "9-10 con", "Canxi nguyên khối & Điện giải: Tôm hấp giữ nguyên canxi, kẽm, i-ốt; nước dừa cho kali, magie — điện giải tự nhiên. Không dầu, không đường. Bé lớn ăn cả vỏ tôm nhỏ để thêm canxi và chitin tốt cho ruột."], [4, "Cải bó xôi xào tỏi (xào nhanh, ít dầu)", "Cải bó xôi, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 & Magie: Cải bó xôi cực giàu vitamin K, magie, sắt, folate — K khoá canxi vào xương, magie ru ngủ. Xào tỏi nhanh ít dầu. Rau xanh đậm là bắt buộc trong bữa tối."], [4, "Canh hến nấu mướp hành", "Hến (Huế), mướp, hành, rau răm", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ hến: Hến rất giàu sắt, magie, kẽm, B12 — nhỏ mà 'có võ'. Nấu mướp ngọt mát. Canh tối giàu magie giúp con ngủ sâu, phòng thiếu máu bé gái."], [4, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin K2 (MK7) & D3 tự nhiên: Lòng đỏ trứng gà ta thả vườn là một trong số ít thực phẩm hàng ngày chứa cả D3 lẫn K2 — D3 giúp ruột hút canxi vào máu, K2 dẫn canxi gắn vào xương. Một quả trứng mỗi sáng là thói quen rẻ nhất nhưng hiệu quả nhất cho chiều cao."], [0, "Cháo sườn non (ninh nhừ, gỡ xương) rắc ruốc", "Sườn non ninh nhừ, gạo tẻ xay, ruốc thịt tự làm, hành lá, tiêu", "1 bát", "1 bát đầy", "1.5 bát", "Collagen & Đạm: Sườn ninh nhừ cho collagen, glycine và đạm — nguyên liệu cho sụn tăng trưởng. Gạo xay nấu sánh dễ ăn, ấm bụng ngày rét. Ruốc tự làm (không đường, ít muối) thay vì quẩy chiên."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Gà ta kho gừng (kho nhạt, không đường)", "Đùi gà ta bỏ da, gừng, hành tím, nước mắm ít, tiêu", "50g", "70g", "90g", "Đạm nạc & Gừng ấm: Gà ta bỏ da là đạm nạc giàu B6, niacin; kho với gừng làm ấm người ngày gió mùa. Kho nhạt — không đường, ít mắm — để không mất canxi qua nước tiểu. Nước kho sánh tự nhiên từ gừng và mỡ gà."], [2, "Natto (đậu tương lên men) trộn xì dầu, hành", "Natto Nhật, xì dầu ít muối, hành lá, chút mù tạt (bé lớn)", "1/2 hộp", "1 hộp", "1 hộp", "Vitamin K2 (MK7): Natto là thực phẩm giàu K2-MK7 nhất thế giới — 1 hộp nhỏ cho lượng K2 gấp hàng chục lần phô mai. K2 là 'người lái xe' đưa canxi gắn thẳng vào xương. Tập cho con ăn từ nửa hộp, trộn cơm nóng."], [2, "Canh súp lơ cà rốt nấu thịt viên", "Súp lơ xanh/trắng, cà rốt, thịt nạc viên, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & C: Súp lơ xanh cho K, C, canxi thực vật; cà rốt cho vitamin A; thịt viên cho đạm. Canh rau củ đầy màu sắc cho bé nhỏ."], [2, "Đậu que luộc rắc mè rang", "Đậu que, mè rang", "100g", "150g", "200g", "Đạm thực vật & K2 từ mè: Đậu que giàu folate, vitamin K; mè rang cho canxi, K2. Luộc giòn, không dầu. Rau nhẹ cho tối."], [2, "Đu đủ chín (gọt, cắt miếng)", "Đu đủ chín cây, bỏ hạt", "100g", "150g", "200g", "Enzyme Papain & Beta-caroten: Đu đủ giúp tiêu hoá đạm, giảm táo bón — điều kiện cần để hấp thu khoáng chất. Giàu beta-caroten, vitamin C, folate hỗ trợ tạo máu và tăng trưởng. Quả quanh năm, giá rẻ, rất hợp bữa phụ sáng."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạnh nhân rang mộc", "Hạnh nhân rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Canxi thực vật & Vitamin E: 10 hạt hạnh nhân cho ~30mg canxi và magie — nằm trong 30% canxi thực vật của nguyên tắc 70/30. Vitamin E bảo vệ màng tế bào sụn. Kết hợp sữa tươi tạo bữa phụ chiều đủ đạm-béo tốt."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Cá lóc kho tộ nghệ (kho nhạt, không đường)", "Cá lóc khúc, nghệ, hành, tiêu, nước dừa", "60g", "80g", "100g", "Đạm trắng & Curcumin: Cá lóc đạm cao, ít béo; nghệ chống viêm, tốt cho dạ dày. Kho nước dừa thay đường. Món buổi tối nhẹ, dễ tiêu, đúng tinh thần 'bụng hơi đói nhẹ' khi ngủ."], [4, "Cải xanh luộc chấm mè rang", "Cải xanh (cải bẹ), mè rang", "100g", "150g", "200g", "Vitamin K2 (MK7) kép: Cải xanh đậm + mè rang — hai nguồn K2 trong một đĩa, đưa canxi từ các bữa trong ngày gắn vào xương trong lúc ngủ. Luộc nhanh giữ màu."], [4, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [4, "Trứng cút luộc (3-5 quả)", "Trứng cút, luộc chín", "3 quả", 1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", "Vitamin C & Chất xơ hoà tan: Bưởi Diễn Hà Nội vào chính vụ tháng 11-12, múi khô ráo, ngọt đậm. Chất xơ pectin giúp no lâu, ổn định đường huyết; vitamin C hỗ trợ tạo collagen cho sụn tăng trưởng. Bé dư cân rất nên ăn bưởi thay vì trái cây ngọt đậm."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Tép đồng rang lá chanh (rang khô, ít muối)", "Tép đồng tươi, lá chanh, hành, tiêu, ít mắm", "2 thìa canh", "3 thìa canh", "4 thìa canh", "Canxi nguyên khối ăn cả vỏ: Tép đồng ăn cả vỏ là nguồn canxi và chitin rất tốt — 100g tép cho hơn 900mg canxi. Rang khô ít dầu, nêm nhạt, thêm lá chanh thơm. Món dân dã Bắc Bộ mà 'đắt giá' cho xương."], [2, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."], [2, "Canh cải thảo cuộn thịt hấp nước dùng gà", "Cải thảo, thịt nạc băm, nấm, nước luộc gà", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & Folate: Cải thảo cho vitamin K, C, folate; thịt nạc cho đạm; nước luộc gà cho glycine. Canh cuộn đẹp mắt, cách làm mới cho bé thích ăn rau."], [2, "Su su xào tỏi", "Su su, tỏi, dầu oliu", "100g", "150g", "200g", "Folate & Vitamin C: Su su mùa đông giòn ngọt, giàu folate, vitamin C, kali, ít calo. Xào tỏi nhanh. Bé thích vị ngọt giòn."], [2, "Chuối chín (ăn tươi)", "Chuối tiêu/chuối sứ chín vàng", "1/2 quả", "1 quả", "1 quả", "Combo Magie & Kali: Chuối là nguồn magie quanh năm, giúp kích hoạt vitamin D và điều phối canxi vào đúng xương. Kali bù điện giải sau vận động. Carb tự nhiên của chuối cho năng lượng bền cho buổi học. Dùng ở bữa phụ trước 18h."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt óc chó (bóc sẵn, ăn với sữa)", "Óc chó nguyên hạt, không muối, không tẩm đường", "3-5 hạt", "5-8 hạt", "8-10 hạt", "DHA/EPA thực vật: Óc chó là hạt giàu omega-3 (ALA) nhất, hỗ trợ phát triển não và giảm viêm ở đầu xương. Kèm magie, kẽm và đồng — bộ khoáng cho tạo xương. Nhai kỹ từng hạt; bé nhỏ nên bẻ nhỏ để tránh hóc."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá hồi áp chảo da giòn (ít dầu oliu)", "Cá hồi Sa Pa/Na Uy phi lê, dầu oliu, tiêu, chanh", "60g", "80g", "100g", "Vitamin D3 từ cá béo & Omega-3: Cá hồi là 'vua D3' trong thực phẩm — D3 là 'xe tải' chở a, hành, tiêu, ít mắm", "3 quả", "4 quả", "5 quả", "Đạm & D3 từ trứng cút: Trứng cút tuy nhỏ nhưng giàu D3, B12, choline. Thịt nạc đùi cho đạm và B1. Kho nước dừa ngọt tự nhiên không đường, ít mắm. Món cơm nhà quen thuộc, bé nào cũng ăn ngon."], [2, "Tàu hũ ky cuộn nấm hấp", "Tàu hũ ky (váng đậu), nấm hương, cà rốt, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật cô đặc: Tàu hũ ky là váng đậu nành — đạm thực vật đậm đặc hơn đậu phụ, giàu canxi, sắt. Cuộn nấm hương hấp, không chiên. Món chay đổi vị cho tỉ lệ 70/30."], [2, "Canh rau ngót nấu thịt nạc băm", "Rau ngót, thịt nạc băm, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin C & Canxi thực vật: Rau ngót là rau giàu đạm thực vật, canxi, vitamin C và K — tốt cho xương và miễn dịch. Thịt nạc băm cho đạm. Canh quen thuộc, nấu nhạt."], [2, "Bông cải xanh hấp chấm mè rang", "Bông cải xanh, mè rang giã, chút muối", "100g", "150g", "200g", "Vitamin K2 (MK7) & Canxi thực vật: Bông cải xanh là rau xanh đậm giàu vitamin K, C, canxi; mè rang thêm canxi và K2. Hấp 3-4 phút giữ màu xanh và vitamin. 'Rau + mè' là công thức K2 cho bữa tối."], [2, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa C  (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm chuẩn & Choline nuôi não: 1 quả trứng cho ~6-7g đạm hoàn chỉnh với đủ 9 acid amin thiết yếu — nguyên liệu trực tiếp để xây mô xương và sụn. Choline trong lòng đỏ hỗ trợ trí nhớ, giúp con học tập tỉnh táo cả buổi sáng. Ăn trước 7h30 để cortisol không tăng cao, GH được bảo vệ."], [0, "Bún cá rô đồng Hà Nội", "Cá rô đồng rán/hấp gỡ xương, bún, rau cải, thì là, nước dùng xương cá", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Đạm trắng & Canxi vi lượng: Cá rô đồng là đặc sản Bắc Bộ, đạm dễ tiêu, giàu canxi và phốt-pho. Rau cải xanh trong bát bún bổ sung K2 và vitamin C. Nước dùng từ xương cá ninh kỹ cho khoáng chất hoà tan. Chọn cách hấp/áp chảo thay vì chiên ngập dầu."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Hồng giòn (gọt vỏ, ăn tươi)", "Hồng giòn Đà Lạt/Mộc Châu cuối vụ, chọn quả đã hết chát", "100g", "150g", "200g", "Beta-caroten & Mangan: Hồng giòn cuối thu giàu beta-caroten (tiền vitamin A) bảo vệ mắt, niêm mạc hô hấp mùa lạnh; mangan tham gia tạo sụn và collagen xương. Ăn lượng vừa phải vì hồng có tannin — không ăn lúc đói."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Gan gà xào hành tây (tối đa 1 lần/tuần)", "Gan gà tươi sạch, hành tây, tỏi, tiêu, dầu oliu", "30g", "40g", "50g", "Sắt Heme & Folate & Siêu Kẽm: Gan là 'viên đa vi chất' tự nhiên — sắt heme, kẽm, vitamin A, B12, folate cực cao. Bé gái 8-14 tuổi nên có gan 1 lần/tuần để phòng thiếu máu. Chỉ 1 lần/tuần vì vitamin A rất cao; chọn gan sạch, xào chín kỹ."], [2, "Đậu phụ kho nấm rơm (kho nhạt)", "Đậu phụ, nấm rơm, hành, tiêu, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Beta-glucan: Đậu phụ kho với nấm rơm — đạm thực vật và beta-glucan tăng đề kháng. Kho nhạt, không chiên đậu trước. Góp phần 30% đạm thực vật mỗi ngày."], [2, "Canh cá diêu hồng nấu thì là cà chua", "Cá diêu hồng, cà chua, thì là, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Đạm trắng & Lycopene: Cá diêu hồng đạm trắng, canxi; cà chua lycopene, vitamin C. Canh cá nấu chua nhẹ, không mỡ, buổi tối nhẹ bụng."], [2, "Cải ngồng xào tỏi", "Cải ngồng, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 từ cải xanh đậm: Cải ngồng mùa đông Hà Nội giòn ngọt, giàu vitamin K, C, canxi, folate. Xào tỏi nhanh. Cấp K2 cho bữa tối."], [2, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt macca (tách sẵn)", "Macca Đắk Lắk/Lâm Đồng, rang mộc không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Chất béo tốt & Mangan: Macca Tây Nguyên giàu chất béo không bão hoà đơn giúp hấp thu vitamin D3-K2 từ sữa, cùng mangan tham gia tổng hợp collagen sụn. Vị bùi, bé dễ ăn; hạn chế 5-10 hạt vì năng lượng cao."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Nghêu hấp sả (lấy nước làm canh)", "Nghêu Bến Tre, sả, gừng, hành lá", "8-10 con", "12-15 con", "15-20 con", "Combo Magie & Sắt: Nghêu cực giàu sắt, magie, kẽm, B12 — rất hợp buổi tối để magie giúp ngủ sâu. Hấp sả 5 phút là chín, không dầu. Nước hấp nghêu ngọt dùng nấu canh rau."], [4, "Súp lơ xanh hấp rưới dầu mè, mè rang", "Súp lơ xanh, dầu mè, mè rang", "100g", "150g", "200g", "Vitamin K2 & Sulforaphane: Súp lơ xanh hấp giữ sulforaphane chống viêm, vitamin K, C; dầu mè + mè rang cho K2 và canxi. Món rau 'vàng' cho xương."], [4, "Canh gà nấu nấm hương hạt sen", "Gà ta, nấm hương, hạt sen, cà rốt, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie ru ngủ & D2: Hạt sen giàu magie, giúp an thần ngủ sâu; nấm hương cho D2; gà cho đạm. Canh tối kiểu thuốc bổ dân gian, ấm bụng ngày rét."], [4, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin K2 (MK7) & D3 tự nhiên: Lòng đỏ trứng gà ta thả vườn là một trong số ít thực phẩm hàng ngày chứa cả D3 lẫn K2 — D3 giúp ruột hút canxi vào máu, K2 dẫn canxi gắn vào xương. Một quả trứng mỗi sáng là thói quen rẻ nhất nhưng hiệu quả nhất cho chiều cao."], [0, "Phở bò tái chín (nước dùng ninh xương, ít muối)", "Bánh phở, thịt bò thăn thái mỏng, nước ninh xương ống, hành lá, giá", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Sắt Heme & Folate: Thịt bò cho sắt heme hấp thu gấp 3 lần sắt thực vật — quan trọng với bé gái 8-14 tuổi phòng thiếu máu. Nước ninh xương cho collagen và glycine hỗ trợ sụn. Nhắc hàng: ít muối, không nêm thêm nước mắm để giữ canxi."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Thanh long (cắt miếng)", "Thanh long ruột đỏ hoặc trắng", "100g", "150g", "200g", "Chất xơ & Betalain: Thanh long ít đường, nhiều xơ và nước, phù hợp bé dư cân. Hạt đen nhỏ chứa omega-3 và magie. Sắc tố betalain ở ruột đỏ chống oxy hoá, bảo vệ tế bào sụn. Dùng bữa phụ, không ăn tối."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Mực hấp gừng sả", "Mực ống tươi, gừng, sả, hành lá, chấm nước mắm gừng loãng", "60g", "80g", "100g", "Đạm trắng & Đồng (Cu): Mực giàu đạm, ít béo, nhiều đồng và selen — đồng cần cho tổng hợp collagen và hấp thu sắt. Hấp gừng sả giữ mực mềm ngọt, không dầu. Món đổi vị hải sản giữa tuần cho đủ 25 loại thực phẩm."], [2, "Đậu đen hầm xương (ninh nhừ, ít muối)", "Đậu đen xanh lòng, xương heo, hành, tiêu", "100g", "150g", "200g", "Đạm thực vật & Anthocyanin: Đậu đen cho đạm thực vật, sắt, magie, anthocyanin ở vỏ. Hầm xương cho collagen. Nêm nhạt, ninh nhừ để bé dễ nhai."], [2, "Canh cải xanh nấu thịt nạc băm gừng", "Cải xanh (cải bẹ), thịt nạc băm, gừng, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K2 (MK7) từ cải xanh đậm: Cải xanh là rau xanh đậm giàu vitamin K, canxi, folate — K giúp khoá canxi vào xương. Gừng làm ấm ngày gió mùa. Thịt nạc băm cho đạm. Canh tối nhẹ, đúng K2."], [2, "Rau lang luộc chấm mè", "Ngọn rau lang, mè rang, muối mè ít muối", "100g", "150g", "200g", "Chất xơ & K2 từ mè: Rau lang giàu xơ, vitamin B6, C; luộc chấm mè rang cho canxi và K2. Chống táo bón — ruột thông thì hấp thu khoáng tốt."], [2, "Kiwi (bổ đôi, nạo thìa)", "Kiwi xanh hoặc vàng chín mềm", "1 quả", "1 quả", "1-2 quả", "Vitamin C & Actinidin: 1 quả kiwi cho hơn 100% nhu cầu vitamin C/ngày, hỗ trợ tổng hợp collagen và hấp thu sắt. Enzyme actinidin giúp tiêu hoá đạm của bữa sáng dễ dàng. Kiwi còn giàu vitamin K và kali — cặp đôi bảo vệ mật độ xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạt bí xanh rang mộc", "Hạt bí ngô tách vỏ, rang không muối", "1 thìa canh", "1.5 thìa", "2 thìa", "Siêu Kẽm & Magie: 1 thìa hạt bí cho lượng kẽm và magie rất cao so với kích thước — kẽm cho GH, magie cho giấc ngủ sâu. Hạt mềm, dễ nhai, phù hợp cả bé 6 tuổi. Có thể rắc lên sữa chua hoặc
