n đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Hàu sữa Vân Đồn hấp gừng sả (hoặc nấu cháo)", "Hàu sữa Vân Đồn/Nha Trang, gừng, sả, chanh", "2-3 con", "3-4 con", "4-5 con", "Siêu Kẽm (Zinc): Hàu là thực phẩm giàu kẽm nhất thế giới — 2-3 con đã đủ kẽm cả ngày. Kẽm kích thích tuyến yên tiết GH và phân chia tế bào sụn. Hấp chín kỹ 5-7 phút, không ăn sống. 1 bữa hàu/tuần là 'liều kẽm' tự nhiên cho con."], [4, "Cải chíp xào nấm đông cô", "Cải chíp (cải thìa), nấm đông cô, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin K2 & D2: Cải chíp là cải xanh đậm cho K, canxi; nấm đông cô cho D2 — cặp D-K hỗ trợ canxi. Xào nhanh ít dầu, đúng rau K2 bữa tối."], [4, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [4, "Nấm hương, nấm kim châm xào tỏi", "Nấm hương, nấm kim châm, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin D2 & Beta-glucan: Nấm là nguồn D2 thực vật, beta-glucan tăng đề kháng mùa lạnh. Xào tỏi nhanh. Góp D cho xương, ít calo."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm chuẩn & Choline nuôi não: 1 quả trứng cho ~6-7g đạm hoàn chỉnh với đủ 9 acid amin thiết yếu — nguyên liệu trực tiếp để xây mô xương và sụn. Choline trong lòng đỏ hỗ trợ trí nhớ, giúp con học tập tỉnh táo cả buổi sáng. Ăn trước 7h30 để cortisol không tăng cao, GH được bảo vệ."], [0, "Cháo yến mạch nấu sữa, rắc hạt chia", "Yến mạch cán dẹt, sữa tươi không đường, chuối chín thái lát, hạt chia", "3 thìa canh", "4 thìa canh", "5 thìa canh", "Beta-glucan tăng đề kháng: Yến mạch là tinh bột chậm hàng đầu, beta-glucan giúp đường huyết ổn định, tăng miễn dịch mùa lạnh. Nấu với sữa tươi cho canxi; chuối cho magie; hạt chia cho omega-3 và canxi thực vật. Bữa sáng ấm, nhanh gọn cho ngày gió mùa."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Kiwi (bổ đôi, nạo thìa)", "Kiwi xanh hoặc vàng chín mềm", "1 quả", "1 quả", "1-2 quả", "Vitamin C & Actinidin: 1 quả kiwi cho hơn 100% nhu cầu vitamin C/ngày, hỗ trợ tổng hợp collagen và hấp thu sắt. Enzyme actinidin giúp tiêu hoá đạm của bữa sáng dễ dàng. Kiwi còn giàu vitamin K và kali — cặp đôi bảo vệ mật độ xương."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Cá thu sốt cà chua (áp chảo nhẹ rồi sốt)", "Cá thu khúc, cà chua tươi, hành tây, tỏi, thì là, dầu oliu", "60g", "80g", "100g", "Vitamin D3 từ cá béo & DHA: Cá thu là cá biển béo giàu D3, DHA, selen — bộ ba cho xương và não. Sốt cà chua cho lycopene và vitamin C. Áp chảo nhẹ 1 thìa dầu rồi sốt, không chiên giòn ngập dầu."], [2, "Natto (đậu tương lên men) trộn xì dầu, hành", "Natto Nhật, xì dầu ít muối, hành lá, chút mù tạt (bé lớn)", "1/2 hộp", "1 hộp", "1 hộp", "Vitamin K2 (MK7): Natto là thực phẩm giàu K2-MK7 nhất thế giới — 1 hộp nhỏ cho lượng K2 gấp hàng chục lần phô mai. K2 là 'người lái xe' đưa canxi gắn thẳng vào xương. Tập cho con ăn từ nửa hộp, trộn cơm nóng."], [2, "Canh su hào cà rốt nấu tôm khô", "Su hào, cà rốt, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin C & Canxi: Su hào mùa đông giàu vitamin C, kali; cà rốt cho vitamin A; tôm khô cho canxi. Canh rau củ ngọt thanh, bé thích."], [2, "Cải ngọt xào tỏi", "Cải ngọt, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K & Canxi thực vật: Cải ngọt — rau xanh đậm mùa đông — giàu vitamin K, C, canxi. Xào tỏi nhanh. Cấp K2 cho bữa tối theo nguyên tắc."], [2, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", "Vitamin C & Chất xơ hoà tan: Bưởi Diễn Hà Nội vào chính vụ tháng 11-12, múi khô ráo, ngọt đậm. Chất xơ pectin giúp no lâu, ổn định đường huyết; vitamin C hỗ trợ tạo collagen cho sụn tăng trưởng. Bé dư cân rất nên ăn bưởi thay vì trái cây ngọt đậm."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt điều rang mộc", "Hạt điều Bình Phước rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Siêu Kẽm (Zinc): Hạt điều là hạt giàu kẽm hàng đầu — kẽm kích thích tuyến yên tiết GH và tham gia phân chia tế bào xương. Thêm magie, sắt, đồng. Bữa phụ chiều có hạt điều + sữa tươi là 'combo đánh thức GH' trước giấc ngủ đêm."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Tôm xào súp lơ xanh tỏi", "Tôm bóc vỏ, súp lơ xanh, tỏi, dầu oliu", "5-6 con", "7-8 con", "9-10 con", "Canxi & Vitamin K2 thực vật: Tôm cho canxi, kẽm; súp lơ xanh là rau xanh đậm giàu vitamin K, C, canxi thực vật. Xào nhanh ít dầu. Một món vừa đạm vừa rau K — gọn cho bữa tối."], [4, "Cải xanh luộc chấm mè rang", "Cải xanh (cải bẹ), mè rang", "100g", "150g", "200g", "Vitamin K2 (MK7) kép: Cải xanh đậm + mè rang — hai nguồn K2 trong một đĩa, đưa canxi từ các bữa trong ngày gắn vào xương trong lúc ngủ. Luộc nhanh giữ màu."], [4, "Canh cua đồng mồng tơi mướp", "Cua đồng giã lọc, mồng tơi, mướp hương, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie ru ngủ: Cua đồng + mồng tơi là 'cặp đôi magie' kinh điển — magie giúp giãn cơ, ngủ sâu, kích hoạt vitamin D và dẫn canxi vào xương. Cua đồng còn cho canxi tự nhiên rất cao. Bát canh tối hoàn hảo cho GH tiết mạnh 22h-2h."], [4, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}], "weeks": [{"name": "🥚 Tuần 1 - Khởi động", "focus": "Tập làm quen 5 trụ cột", "sections": [{"h": "🎯 TRỌNG TÂM TUẦN NÀY", "items": ["Tuần đầu tiên không cần hoàn hảo — chỉ cần cả nhà làm quen với 5 trụ cột: trứng luộc + sữa trước 7h30, đủ 5-6 đơn vị sữa xong trước 18h, 8 nhóm thực phẩm mỗi ngày, ngủ trước 22h và vận động 60 phút. Gió mùa Đông Bắc đã về, bữa sáng ấm nóng là 'bệ phóng' để con tỉnh táo cả ngày."]}, {"h": "💬 LỜI NHẮN TỪ DƯỢC SĨ THẮNG", "items": ["Anh chị thân mến, tháng 11 Hà Nội đã se lạnh, buổi sáng con hay dậy muộn và dễ bỏ bữa. Em nhắc một điều rất quan trọng: bỏ bữa sáng làm não thiếu glucose, cortisol — hormone căng thẳng — tăng lên và cản trực tiếp hormone tăng trưởng GH. Vì vậy tuần này, việc đầu tiên là đưa con vào nếp: ăn sáng trước 7h30 với 1 quả trứng gà ta luộc, 200ml sữa tươi không đường và 1 món chính có tinh bột chậm. Điều thứ hai, anh chị hãy áp dụng quy tắc 'no 70-80% thì dừng' — không ép con ăn thêm, vì dạ dày trẻ có hạn, nhồi quá nhiều thì con tăng cân chứ không tăng cao. Mỗi bữa ăn chỉ nên kéo dài 30-35 phút, cất điện thoại và tắt tivi để con nhai kỹ, ăn chậm. Cuối cùng, anh chị hãy mở Mục lục, tính lượng nước theo cân nặng của con và chia đều trong ngày. Bắt đầu nhẹ nhàng, giữ đều là thắng."]}, {"h": "🌱 CHỦ NHẬT TUẦN NÀY ANH CHỊ SẼ THẤY", "items": ["1. Con tự giác ăn sáng trước 7h30 ít nhất 5/7 ngày, không cần giục nhiều", "2. Con quen vị sữa tươi không đường và sữa chua không đường, không đòi sữa có đường", "3. Bữa tối kết thúc trước 19h30, con đi ngủ trước 22h ít nhất 4 đêm", "4. Anh chị đã tính được lượng nước theo cân nặng con và con uống đều, không dồn một lúc"]}, {"h": "✅ VIỆC CẦN LÀM TUẦN NÀY", "items": ["1. Đo chiều cao và cân nặng đầu tháng vào sáng sớm, ghi vào sheet Nhật ký chiều cao", "2. Đi chợ theo thực đơn tuần: trứng gà ta, sữa tươi không đường, sữa chua không đường, cam vàng, bưởi Diễn, cua đồng, ngao, cải xanh, mè rang", "3. Cài nhắc giờ trên điện thoại: 7h00 ăn sáng, 15h30 sữa chiều, 19h00 ăn tối, 21h30 chuẩn bị ngủ", "4. In sheet Tick 6 thói quen, dán tủ lạnh, để con tự tick mỗi tối"]}]}, {"name": "⚡ Tuần 2 - Tăng tốc", "focus": "Đánh thức hormone GH", "sections": [{"h": "🎯 TRỌNG TÂM TUẦN NÀY", "items": ["Tuần này tập trung 'đánh thức' hormone tăng trưởng GH bằng Kẽm (hàu, thịt bò, hạt bí, hạt điều) + Magie (cua đồng, ngao, hến, mồng tơi, rau dền) + giấc ngủ sâu 22h-2h. Bữa tối nhẹ, xong trước 19h30, không sữa, không trái cây, để con ngủ với bụng 'hơi đói nhẹ'."]}, {"h": "💬 LỜI NHẮN TỪ DƯỢC SĨ THẮNG", "items": ["Anh chị ơi, nhiều gia đình vẫn giữ thói quen cho con uống sữa trước khi ngủ hoặc ăn trái cây sau 20h. Em xin giải thích thật đời thường: ăn uống muộn làm đường huyết tăng, cơ thể phải tiết insulin, mà insulin thì 'khoá' GH lại đúng vào khung giờ GH tiết mạnh nhất là 22h-2h. Vì vậy tuần này, mọi sữa và trái cây hoàn thành trước 18h, bữa tối xong trước 19h30 và con đi ngủ với cảm giác hơi đói nhẹ — đó là lúc tuyến yên làm việc hăng nhất. Thực đơn tuần này có hàu, thịt bò, hạt bí, hạt điều để cấp Kẽm — khoáng chất kích tuyến yên tiết GH; có cua đồng, ngao, hến, mồng tơi, rau dền để cấp Magie — giúp con giãn cơ, ngủ sâu. Riêng bé gái 8-14 tuổi, em đã xếp gan gà xào và thịt bò, rau dền trong tuần để bổ sung Sắt, phòng thiếu máu khi dậy thì. Anh chị giữ nếp cho con, kết quả sẽ đến."]}, {"h": "🌱 CHỦ NHẬT TUẦN NÀY ANH CHỊ SẼ THẤY", "items": ["1. Con ngủ nhanh hơn, ít trằn trọc, sáng dậy tươi tỉnh — dấu hiệu Magie và giờ ngủ đã đúng", "2. Con không còn đòi ăn vặt hay uống sữa sau 20h", "3. Con ăn được hàu, ngao, hến — những món 'mới' giàu Kẽm, Magie mà trước đây hay từ chối", "4. Bé gái lớn ăn được thịt bò, gan, rau dền ít nhất 2-3 bữa trong tuần"]}, {"h": "✅ VIỆC CẦN LÀM TUẦN NÀY", "items": ["1. Mua hàu sữa tươi, hấp chín kỹ 5-7 phút — 1 bữa trong tuần", "2. Chuẩn bị sẵn hạt bí, hạt điều rang mộc chia hộp nhỏ cho bữa phụ chiều", "3. Chụp ảnh bữa tối 3 ngày bất kỳ gửi em để em góp ý lượng cơm theo cân nặng con", "4. Tắt đèn phòng ngủ trước 22h, không màn hình sau 21h — kiểm tra lại giờ ngủ trong sheet Tick"]}]}, {"name": "🦴 Tuần 3 - Bứt phá", "focus": "Khoá canxi vào xương bằng D3 + K2", "sections": [{"h": "🎯 TRỌNG TÂM TUẦN NÀY", "items": ["Có canxi chưa đủ — phải đưa được canxi vào xương. Tuần này tăng cường Vitamin D3 (cá hồi, cá thu, lòng đỏ trứng, nấm, tắm nắng sớm 15-30 phút) và Vitamin K2 (mè rang, cải xanh đậm, natto, phô mai). Nhu cầu canxi tuổi dậy thì 1000-1200mg/ngày, ưu tiên từ thực phẩm. Tuần có ngày 20/11 — cảnh giác bánh kẹo, nước ngọt ở trường."]}, {"h": "💬 LỜI NHẮN TỪ DƯỢC SĨ THẮNG", "items": ["Anh chị hình dung thế này: Canxi là 'hàng hoá', Vitamin D3 là 'xe tải' chở canxi từ ruột vào máu, còn Vitamin K2 là 'người lái xe' đưa canxi từ máu gắn đúng vào xương, thay vì lắng đọng ở mạch máu hay mô mềm. Thiếu D3, canxi không vào được máu; thiếu K2, canxi đi lạc đường. Vì vậy tuần này em xếp cá hồi, cá thu, trứng, nấm cho D3; mè rang, cải xanh đậm, natto, phô mai cho K2 — hầu như bữa tối nào cũng có mè rang hoặc cải xanh đậm. Trời tháng 11 ít nắng, anh chị tranh thủ cho con ra sân 15-30 phút buổi sáng khi có nắng, để tay chân hở để da tự tổng hợp D3. Một lưu ý nữa: ăn mặn làm canxi mất qua nước tiểu — nên mọi món đều nấu nhạt, nước chấm pha loãng. Tuần này có 20/11, con đi chúc mừng thầy cô, anh chị nhắc con 'không nước ngọt, bánh kẹo chỉ một chút' nhé."]}, {"h": "🌱 CHỦ NHẬT TUẦN NÀY ANH CHỊ SẼ THẤY", "items": ["1. Con ăn được cá béo (cá hồi/cá thu) ít nhất 2 bữa và không sợ xương", "2. Con quen mè rang, cải xanh đậm trong bữa tối; bé lớn tập ăn được nửa hộp natto", "3. Con được phơi nắng sáng ít nhất 3 buổi trong tuần", "4. Cả nhà nấu nhạt hơn: không chai nước mắm trên bàn ăn, nước chấm pha loãng"]}, {"h": "✅ VIỆC CẦN LÀM TUẦN NÀY", "items": ["1. Mua cá hồi/cá thu tươi, mè đen rang sẵn 1 lọ, natto (nếu bé lớn), phô mai ít muối", "2. Đo chiều cao giữa tháng (sáng sớm, chân trần, thước dán tường), ghi vào Nhật ký", "3. Chụp ảnh con tắm nắng/vận động ngoài trời gửi em để khích lệ con", "4. Chuẩn bị 'kịch bản 20/11': con ăn sáng no trước khi đi, mang theo chai nước lọc, hạn chế bánh kẹo ở lớp"]}]}, {"name": "🌱 Tuần 4 - Duy trì", "focus": "Biến thành thói quen sau 21 ngày", "sections": [{"h": "🎯 TRỌNG TÂM TUẦN NÀY", "items": ["Sau 21 ngày, nếp ăn-ngủ-vận động đã thành thói quen. Tuần này tập trung kiểm soát cân nặng để tránh dậy thì sớm: mỡ thừa làm tăng estrogen, khiến sụn tăng trưởng đóng sớm. Bé dư cân siết 4-2-0 buổi tối; bé gái sau khi có kinh chỉ nên tăng tối đa 2-3kg/năm. Cha mẹ làm gương ăn nhạt, cùng con đọc nhãn dinh dưỡng."]}, {"h": "💬 LỜI NHẮN TỪ DƯỢC SĨ THẮNG", "items": ["Anh chị thân mến, đến tuần này em muốn nói về cân nặng — vì thừa cân là 'kẻ thù thầm lặng' của chiều cao. Mỡ thừa tích nhiều làm tăng estrogen, estrogen kích thích xương cốt hoá nhanh và sụn tăng trưởng đóng lại sớm hơn tuổi. Nên nếu tháng này con tăng cân nhanh hơn tăng cao, anh chị hãy siết bữa tối theo 4-2-0: bỏ cơm, giữ đạm và rau; còn bé thiếu cân thì vẫn cho chút tinh bột tối. Riêng bé gái đã có kinh, chỉ nên tăng tối đa 2-3kg mỗi năm. Một việc rất hiệu quả mà ít tốn công: cuối tuần anh chị dắt con đi siêu thị, cùng con đọc nhãn dinh dưỡng — tìm dòng 'đường' và 'natri' — để con tự thấy nước ngọt, snack, xúc xích 'nặng' thế nào. Cha mẹ ăn nhạt, ăn chậm, con sẽ bắt chước. Thói quen đã hình thành rồi, giờ chỉ cần giữ đều — không hoàn hảo, nhưng đều."]}, {"h": "🌱 CHỦ NHẬT TUẦN NÀY ANH CHỊ SẼ THẤY", "items": ["1. Con tự tick thói quen mỗi tối mà không cần nhắc, tỉ lệ tick ≥ 70%", "2. Con tự dừng khi no 70-80%, không ăn hết sạch chỉ vì bị giục", "3. Con biết đọc nhãn 'đường' và 'natri' trên bao bì và tự từ chối nước ngọt", "4. Cân nặng ổn định hoặc tăng chậm, trong khi chiều cao đang nhích lên"]}, {"h": "✅ VIỆC CẦN LÀM TUẦN NÀY", "items": ["1. Cân con vào sáng sớm, so với đầu tháng: nếu tăng cân nhanh hơn tăng cao → siết 4-2-0 buổi tối", "2. Cùng con đi siêu thị, chọn 3 sản phẩm và đọc nhãn dinh dưỡng, loại bỏ 1 món nhiều đường khỏi giỏ", "3. Đổi 1 món con hay chán bằng món tương đương trong thực đơn (cá hồi ↔ cá thu, cua đồng ↔ ngao) để giữ hứng thú", "4. Chuẩn bị thước, giấy bút cho buổi đo cuối tháng vào tuần tới"]}]}, {"name": "🎉 Tuần cuối - Tổng kết", "focus": "Đo lại, ăn mừng, chuẩn bị tháng 12", "sections": [{"h": "🎯 TRỌNG TÂM TUẦN NÀY", "items": ["Hai ngày cuối tháng: đo lại chiều cao, cân nặng, tổng kết tỉ lệ tick 6 thói quen và ăn mừng những gì cả nhà làm được. Chuẩn bị bước sang tháng 12 — mùa lạnh đỉnh, cần tăng cường D3 mạnh hơn. Tuyệt đối không tự ý dùng thực phẩm chức năng, đồ bổ không rõ nguồn gốc để 'chạy nước rút'."]}, {"h": "💬 LỜI NHẮN TỪ DƯỢC SĨ THẮNG", "items": ["Anh chị ơi, một tháng trôi qua rất nhanh. Dù con tăng được bao nhiêu, điều em muốn anh chị tự hào nhất là nếp sống mới của cả nhà: ăn sáng đúng giờ, sữa xong trước 18h, tối nhẹ bụng, ngủ trước 22h. Chiều cao là cuộc chạy marathon nhiều năm — mỗi tháng giữ đúng nếp là một bước chắc. Khi đo cuối tháng, anh chị đo sáng sớm, chân trần, thước dán tường, rồi ghi vào Nhật ký để file tự tính và đánh giá. Em xin nhắc một điều rất quan trọng trước khi sang tháng mới: tuyệt đối không tự ý cho con dùng yến, cao nhung hươu, sâm hay bất kỳ 'thuốc tăng chiều cao' không rõ nguồn gốc nào — nhiều sản phẩm chứa hormone, có thể làm sụn tăng trưởng đóng sớm vĩnh viễn, mất đi cơ hội không bao giờ lấy lại được. Tháng 12 trời lạnh đỉnh, ít nắng, em sẽ xếp thêm cá béo, trứng, nấm để cấp D3 mạnh hơn. Cảm ơn anh chị đã kiên trì cùng con — hãy ăn mừng bằng một bữa cơm gia đình thật vui nhé!"]}, {"h": "🌱 CHỦ NHẬT TUẦN NÀY ANH CHỊ SẼ THẤY", "items": ["1. Có số đo chiều cao, cân nặng cuối tháng chính xác, ghi vào Nhật ký và file tự đánh giá tốc độ", "2. Tỉ lệ tick 6 thói quen cả tháng được tổng kết, cả nhà biết thói quen nào còn yếu", "3. Con được khen và ăn mừng vì nỗ lực — không phải vì con số", "4. Anh chị đã có thực đơn tháng 12 và danh sách đi chợ tuần đầu"]}, {"h": "✅ VIỆC CẦN LÀM TUẦN NÀY", "items": ["1. Đo chiều cao, cân nặng cuối tháng vào sáng 30/11, ghi vào Nhật ký, chụp ảnh gửi em", "2. Mở sheet Tick 6 thói quen, xem xếp hạng tự động, chọn 1 thói quen yếu nhất để ưu tiên tháng 12", "3. Làm một bữa cơm ăn mừng cả nhà (vẫn theo nguyên tắc) — cho con chọn 1 món trong thực đơn", "4. Nhắn em để nhận bộ thực đơn tháng 12/2026 và điều chỉnh theo kết quả đo của con"]}]}], "toc": [{"h": "1. 💬 LỜI NHẮN ĐẦU THÁNG", "items": ["Anh chị thân mến, đây là bộ thực đơn 30 ngày tháng 11/2026 — tháng của gió mùa Đông Bắc, cam vàng, quýt hồng, bưởi Diễn và ngày 20/11. Mỗi ngày có 5 bữa cố định (3 chính + 2 phụ), định lượng theo 3 nhóm tuổi 6-10t / 11-15t / 16-18t, kèm lịch sữa và lịch nước. Anh chị không cần làm đúng 100% — hãy giữ đúng 5 nguyên tắc vàng, đổi món linh hoạt theo chợ gần nhà, và tick thói quen mỗi tối. Mọi thắc mắc, anh chị nhắn em theo thông tin ở cuối trang."]}, {"h": "2. 🗓️ 4 CHẶNG TUẦN (bấm để mở)", "items": ["🥚 Tuần 1 - Khởi động — ngày 01-07/11 (bấm để mở)", "    Tuần đầu tiên không cần hoàn hảo — chỉ cần cả nhà làm quen với 5 trụ cột: trứng luộc + sữa trước 7h30, đủ 5-6 đơn vị sữa xong trước 18h, 8 nhóm thực phẩm mỗi ngày, ngủ trước 22h và vận động 60 phút.", "⚡ Tuần 2 - Tăng tốc — ngày 08-14/11 (bấm để mở)", "    Tuần này tập trung 'đánh thức' hormone tăng trưởng GH bằng Kẽm (hàu, thịt bò, hạt bí, hạt điều) + Magie (cua đồng, ngao, hến, mồng tơi, rau dền) + giấc ngủ sâu 22h-2h.", "🦴 Tuần 3 - Bứt phá — ngày 15-21/11 (bấm để mở)", "    Có canxi chưa đủ — phải đưa được canxi vào xương.", "🌱 Tuần 4 - Duy trì — ngày 22-28/11 (bấm để mở)", "    Sau 21 ngày, nếp ăn-ngủ-vận động đã thành thói quen.", "🎉 Tuần cuối - Tổng kết — ngày 29-30/11 (bấm để mở)", "    Hai ngày cuối tháng: đo lại chiều cao, cân nặng, tổng kết tỉ lệ tick 6 thói quen và ăn mừng những gì cả nhà làm được."]}, {"h": "3. ⭐ 5 NGUYÊN TẮC VÀNG", "items": ["1. Bữa sáng là bệ phóng: ăn trước 7h30, luôn có 1 trứng gà ta luộc + 200ml sữa tươi không đường + 1 món chính tinh bột chậm (theo tỉ lệ 4-2-1 đạm-rau-tinh bột)", "2. Sữa và trái cây hoàn thành trước 18h; không sữa buổi tối, không sữa trong 2 tiếng trước ngủ. Bé 6-9 tuổi 5 đơn vị sữa/ngày, từ 10 tuổi 6 đơn vị", "3. Bữa tối nhẹ, xong trước 19h30, ưu tiên Magie (cua đồng, ngao, hến, mồng tơi, rau dền) + K2 (mè rang, cải xanh đậm); bé dư cân áp dụng 4-2-0 (bỏ cơm); đi ngủ với bụng 'hơi đói nhẹ' để GH tiết mạnh 22h-2h", "4. Đa dạng: 8 loại thực phẩm/ngày, 25 loại/tuần; đạm và canxi 70% động vật – 30% thực vật; ăn đến no 70-80% thì dừng, không ép ăn", "5. Nấu nhạt, hạn chế chiên rán, không đồ ăn sẵn, không đường tinh luyện sau 17h; uống nước theo công thức cân nặng, chia đều trong ngày"]}, {"h": "4. 💧 CÔNG THỨC NƯỚC THEO CÂN NẶNG", "items": ["Dưới 10kg: 100 × cân nặng = ... ml", "10-20kg: 1000 + 50 × (cân nặng − 10) = ... ml", "Từ 21kg trở lên: 1500 + 20 × (cân nặng − 20) = ... ml", "Ví dụ: bé 30kg → 1500 + 20 × 10 = 1700ml ≈ 7 cốc 250ml", "Tham chiếu: 6-10 tuổi 1.5-2 lít/ngày; 11-16 tuổi 2-2.5 lít/ngày (đã gồm canh, sữa)", "Phân bổ: Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "Ưu tiên nước lọc ấm ngày lạnh; không nước ngọt, không nước ép đóng hộp có đường; cốc cuối trong ngày uống trước 20h"]}, {"h": "5. 🥛 LỊCH SỮA CHUẨN THEO TUỔI", "items": ["Quy đổi: 1 đơn vị = 100ml sữa tươi = 1 hộp sữa chua (100g) = 15g phô mai (1 miếng)", "6-9 tuổi: 5 đơn vị/ngày — Sáng 200ml sữa tươi (2) + Phụ sáng 1 hộp sữa chua (1) + Phụ chiều 200ml sữa tươi (2)", "Từ 10 tuổi: 6 đơn vị/ngày — Sáng 200ml (2) + Phụ sáng 1 hộp sữa chua (1) + Trưa 1 miếng phô mai (1) + Phụ chiều 200ml (2)", "Quy tắc cứng 1: Toàn bộ sữa xong trước 18h", "Quy tắc cứng 2: Không uống sữa buổi tối, không uống trong 2 tiếng trước khi ngủ", "Quy tắc cứng 3: Sữa tươi nguyên chất không đường — không thay bằng sữa có đường, sữa trái cây, sữa đặc"]}, {"h": "6. ✅ 6 THÓI QUEN VÀNG (tick mỗi tối ở sheet cuối)", "items": ["1. Trứng + sữa bữa sáng trước 7h30", "2. Đủ 5-6 đơn vị sữa, xong trước 18h", "3. Đủ 8 nhóm thực phẩm trong ngày", "4. Ngủ trước 22h (tắt màn hình sau 21h)", "5. Vận động 60 phút (nhảy dây, bơi, bóng rổ, chạy, xà đơn)", "6. Ăn tối trước 19h30, không ăn khuya"]}, {"h": "7. 🍽️ THÓI QUEN BÀN ĂN", "items": ["Bữa ăn kéo dài 30-35 phút, không ăn quá nhanh", "Nhai kỹ, ăn chậm — ăn đến khi no 70-80% thì dừng", "Không điện thoại, không tivi khi ăn", "Không ép ăn, không dùng đồ ăn nhanh làm phần thưởng", "Cha mẹ làm gương: ăn nhạt, hạn chế dầu mỡ, cùng con đọc nhãn dinh dưỡng khi đi siêu thị"]}, {"h": "8. 🚫 NHÓM THỰC PHẨM 'ĐẠI KỴ'", "items": ["Đồ ngọt, đường tinh luyện, nước ngọt có ga → tăng insulin, giảm GH; acid phosphoric cản hấp thu canxi", "Thức ăn nhanh, chiên rán, xúc xích → calo rỗng, chất béo xấu, rối loạn nội tiết, nguy cơ dậy thì sớm", "Đồ quá mặn (mắm, dưa cà muối mặn, snack) → đào thải canxi qua nước tiểu", "Tự ý dùng thực phẩm chức năng, đồ bổ (yến, nhung hươu, sâm, 'thuốc tăng chiều cao' không r // ---------- storage: flat key/value map F (synced per family) -> derived view R ----------
// Keys: k/<id>/c (created) · k/<id>/x (deleted) · k/<id>/a (age group override) · k/<id>/p/<f> profile
//       k/<id>/h/<day>/<i> habit tick · k/<id>/l/<f> height log · s/<key> shopping list
const KEY='thucdon-t11-2026', FKEY='thucdon-t11-2026-v2', MKEY='thucdon-sync';
const API='https://caovn-api.linhizi.com';
const lsGet = k => { try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const newId = () => 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let F = lsGet(FKEY) || {};            // key -> value
let M = Object.assign({fam:null, since:0, queue:[], active:null}, lsGet(MKEY)||{});
function persist(){ lsSet(FKEY,F); lsSet(MKEY,M); }

// flatten old-format state {kids:[...],shop} or {age,habits,profile,log} into ops
function flattenOld(o){
  const ops=[]; if(!o) return ops;
  if(!Array.isArray(o.kids)) o={kids:[{id:newId(),age:o.age,habits:o.habits,profile:o.profile,log:o.log}],shop:o.shop};
  o.kids.forEach((k,i)=>{ const id=k.id||newId(); ops.push([`k/${id}/c`, Date.now()+i]);
    if(k.age!=null) ops.push([`k/${id}/a`, k.age]);
    Object.entries(k.profile||{}).forEach(([f,v])=>{ if(v!=='' && v!=null) ops.push([`k/${id}/p/${f}`, String(v)]); });
    Object.entries(k.log||{}).forEach(([f,v])=>{ if(v!=='' && v!=null) ops.push([`k/${id}/l/${f}`, String(v)]); });
    Object.entries(k.habits||{}).forEach(([d,arr])=>(arr||[]).forEach((v,j)=>{ if(v) ops.push([`k/${id}/h/${d}/${j}`,1]); }));
  });
  Object.entries(o.shop||{}).forEach(([k,v])=>{ if(v) ops.push(['s/'+k,1]); });
  return ops;
}
function setK(k,v,quiet){ F[k]=v; M.queue.push(k); persist(); if(!quiet){ build(); scheduleSync(800); } }
function setMany(ops){ ops.forEach(([k,v])=>{ F[k]=v; M.queue.push(k); }); persist(); build(); scheduleSync(300); }

let R={kids:[],shop:{}}, S=null;
function build(){
  const kids={};
  for(const [k,v] of Object.entries(F)){
    if(k.startsWith('s/')){ continue; }
    const m=k.match(/^k\/([^/]+)\/(.*)$/); if(!m) continue;
    const kid = kids[m[1]] || (kids[m[1]]={id:m[1],c:0,x:0,age:null,profile:{},log:{},habits:{}});
    const r=m[2];
    if(r==='c') kid.c=v; else if(r==='x') kid.x=v; else if(r==='a') kid.age=(v===null||v===undefined)?null:+v;
    else if(r.startsWith('p/')) kid.profile[r.slice(2)]=v??'';
    else if(r.startsWith('l/')) kid.log[r.slice(2)]=v??'';
    else if(r.startsWith('h/')){ const [d,i]=r.slice(2).split('/'); (kid.habits[d]||(kid.habits[d]=[false,false,false,false,false,false]))[+i]=!!v; }
  }
  R.kids=Object.values(kids).filter(k=>!k.x && k.c).sort((a,b)=>a.c-b.c);
  R.shop={}; for(const [k,v] of Object.entries(F)) if(k.startsWith('s/')&&v) R.shop[k.slice(2)]=true;
  S = R.kids.find(k=>k.id===M.active) || R.kids[0] || null;
  R.active = S && S.id;
}
function ensureKid(){ build(); if(!R.kids.length){ const id=newId(); setK(`k/${id}/c`, Date.now(), true); M.active=id; build(); } }
function setActive(id){ M.active=id; persist(); build(); }
const kidName = (k,i) => k.profile.name || ('Bé '+(i+1));

// one-time migration from v1 local storage
if(!lsGet(FKEY)){ const old=lsGet(KEY); if(old){ flattenOld(old).forEach(([k,v])=>{F[k]=v;}); if(old.active) M.active=null; persist(); } }
ensureKid();

const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){ const b=new Uint8Array(16); crypto.getRandomValues(b); return Array.from(b,x=>CODE_ABC[x%32]).join(''); }
const fmtCode = c => c.replace(/(.{4})(?=.)/g,'$1-');
const famLink = c => location.origin+location.pathname+'#gd='+c;
let syncState='off', syncTimer=null, syncing=false, pendingRender=false;
function scheduleSync(ms){ if(!M.fam) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync, ms); }
async function sync(){
  if(!M.fam || syncing) return; syncing=true; setSync('busy');
  try{
    if(M.queue.length){
      const n=M.queue.length, keys=[...new Set(M.queue)];
      for(let i=0;i<keys.length;i+=400){
        const ops=keys.slice(i,i+400).map(k=>[k, F[k]===undefined?null:F[k]]);
        const r=await fetch(API+'/f/'+M.fam,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ops})});
        if(!r.ok) throw new Error('push '+r.status);
      }
      M.queue=M.queue.slice(n); persist();
    }
    const r=await fetch(API+'/f/'+M.fam+'?since='+Math.max(0,M.since-3000));
    if(!r.ok) throw new Error('pull '+r.status);
    const j=await r.json(); let changed=false; const pend=new Set(M.queue);
    for(const [k,v,t] of j.rows){ if(t>M.since) M.since=t; if(pend.has(k)) continue;
      if(JSON.stringify(F[k])!==JSON.stringify(v)){ if(v===null) delete F[k]; else F[k]=v; changed=true; } }
    persist(); setSync('ok');
    if(changed){ ensureKid(); refreshAll(true); }
  }catch(e){ setSync(navigator.onLine===false?'offline':'err'); }
  finally{ syncing=false; if(M.queue.length) scheduleSync(4000); }
}
function setSync(st){ syncState=st; const el=$('#syncDot'); if(!el) return;
  const map={off:['',''],busy:['⏳','Đang đồng bộ…'],ok:['☁️','Đã đồng bộ với cả nhà'],offline:['📴','Mất mạng — sẽ tự đồng bộ lại'],err:['⚠️','Chưa đồng bộ được — sẽ thử lại']};
  el.textContent=map[st][0]; el.title=map[st][1]; const t=$('#syncText'); if(t) t.textContent=map[st][1]; }
function refreshAll(remote){
  if(!S) return;
  const ae=document.activeElement;
  if(remote && ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.closest('main')){ pendingRender=true; return; }
  renderAgeChip(); renderHdr(); renderKids(); render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(pendingRender){ pendingRender=false; refreshAll(true); } },50));
setInterval(()=>{ if(M.fam && document.visibilityState==='visible') sync(); }, 15000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') sync(); });
window.addEventListener('online',()=>sync());
const hasData = () => Object.keys(F).some(k=>!/\/c$/.test(k));
function createFamily(){
  M.fam=newCode(); M.since=0; M.queue=Object.keys(F); persist(); sync(); refreshAll();
  toast('Đã tạo nhóm gia đình — gửi link cho cả nhà nhé');
}
async function joinFamily(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^[A-Z2-9]{16}$/.test(code)){ toast('Mã gia đình không đúng'); return false; }
  if(M.fam===code) return true;
  let keep=false;
  if(hasData()) keep=confirm('Trên máy này đã có dữ liệu của bé.\n\nOK = GỘP dữ liệu này vào sổ tay gia đình\nHủy = Bỏ dữ liệu trên máy này, chỉ dùng dữ liệu của gia đình');
  if(!keep) F={};
  M.fam=code; M.since=0; M.queue=keep?Object.keys(F):[]; M.active=null; persist();
  build(); await sync(); ensureKid(); refreshAll();
  toast('Đã vào sổ tay gia đình ✓'); return true;
}
function leaveFamily(){
  if(!confirm('Ngừng đồng bộ trên máy này? Dữ liệu hiện có vẫn giữ lại trên máy, nhưng sẽ không cập nhật với cả nhà nữa.')) return;
  M.fam=null; M.since=0; M.queue=[]; persist(); setSync('off'); refreshAll(); toast('Đã rời nhóm trên máy này');
}
async function shareLink(){

}

const weekOf = d => WEEK_RANGES.findIndex(([a,b])=>d>=a&&d<=b);
function todayDay(){ const n=new Date(); return (n.getFullYear()===2026&&n.getMonth()===10)?n.getDate():1; }
const isToday = d => { const n=new Date(); return n.getFullYear()===2026&&n.getMonth()===10&&n.getDate()===d; };

// age group: explicit choice, else derive from profile age, else 0
function ageIdx(){
  if(S.age!=null) return S.age;
  const a=parseFloat(S.profile.age); if(!isNaN(a)) return a<=10?0:a<=15?1:2;
  return 0;
}
function childAge(){ const a=parseFloat(S.profile.age); return isNaN(a)?null:a; }
function waterMl(kg){ if(!(kg>0)) return null; return kg<10?100*kg:kg<=20?1000+50*(kg-10):1500+20*(kg-20); }

function habitCount(d){ return (S.habits[d]||[]).filter(Boolean).length; }
function totalTicks(){ let t=0; for(let d=1;d<=30;d++) t+=habitCount(d); return t; }

function rating(){
  const r=totalTicks()/180;
  if(r>=.85) return '🏆 XUẤT SẮC! Con anh chị chắc chắn cao lên 🚀';
  if(r>=.7) return '💪 TỐT! Cả nhà đang đi đúng đường';
  if(r>=.55) return '🌱 KHÁ. Tuần sau cố gắng thêm chút nữa nhé';
  if(totalTicks()>0) return '🌈 Bắt đầu là tốt rồi. Tháng sau mình tăng tốc nhé!';
  return 'Chưa có dữ liệu — tick mỗi tối nhé';
}
function heightCalc(){
  const L=S.log, h0=parseFloat(L.h0), h2=parseFloat(L.h2), w0=parseFloat(L.w0), w2=parseFloat(L.w2), goal=parseFloat(S.profile.goal);
  const out={};
  if(!isNaN(h0)&&!isNaN(h2)){ const g=+(h2-h0).toFixed(2); out.gain=g+' cm';
    out.rate=g>=1?'🏆 XUẤT SẮC':g>=.5?'💪 TỐT':g>=.3?'🌱 KHÁ':'⚠️ Cần xem lại';
    if(!isNaN(goal)&&goal>h0) out.pct=Math.round(g/((goal-h0)/12)*100)+'%'; }
  if(!isNaN(w0)&&!isNaN(w2)) out.wgain=+(w2-w0).toFixed(2)+' kg';
  return out;
}

  html+=T.filter(s=>!/4 CHẶNG TUẦN/.test(s.h)).map((s,i)=>`<details class="acc" ${i===0?'open':''}><summary>${esc(s.h.replace(/^\d+\.\s*/,'').replace(' (tick mỗi tối ở sheet cuối)',''))}</summary><div class="body">
    ${s.items.length>1?`<ul class="clean">${s.items.map(x=>`<li>${esc(x.replace(/^\d+\.\s*/,''))}</li>`).join('')}</ul>`:`<p>${esc(s.items[0])}</p>`}
    ${/LIÊN HỆ/.test(s.h)?'<div class="row" style="margin-top:8px;flex-wrap:wrap"><a class="btn primary" href="tel:0866767313" style="text-decoration:none">📞 Gọi</a><a class="btn" href="https://zalo.me/0866767313" target="_blank" rel="noopener" style="text-decoration:none">💬 Zalo</a><a class="btn" href="mailto:edu.thang@gmail.com" style="text-decoration:none">✉️ Email</a></div>':''}
  </div></details>`).join('');
  $('#v-guide').innerHTML=html;
  const upd=()=>{const ml=waterMl(parseFloat($('#wkg').value)); $('#wout').textContent=ml?ml+' ml':'—'; $('#wcup').textContent=ml?'≈ '+Math.round(ml/250)+' cốc 250ml':'ml/ngày';};
  $('#wkg').oninput=upd; upd();
}

function renderHdr(){ $('#hdrSub').textContent = R.kids.length>1 ? ('Tháng 11/2026 · Gia đình '+R.kids.length+' bé') : (S.profile.name ? ('Tháng 11/2026 · Sổ tay của '+S.profile.name) : 'Tháng 11/2026 · DS Vũ Đức Thắng'); }
function renderKids(){
  const el=$('#kidbar');
  el.innerHTML = R.kids.map((k,i)=>`<button class="kid ${k.id===R.active?'on':''}" data-kid="${k.id}">${k.profile.sex==='Nữ'?'👧':'👦'} ${esc(kidName(k,i))}</button>`).join('')
    + `<button class="kid add" id="addKid">＋ Thêm con</button>` + (M.fam?`<button class="kid add" id="famBtn" title="Sổ tay gia đình">👨‍👩‍👧 Cả nhà</button>`:`<button class="kid add" id="famBtn">🔗 Chia sẻ cả nhà</button>`);
  el.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{ if(b.dataset.kid===R.active) return; setActive(b.dataset.kid); renderAgeChip(); renderHdr(); renderKids(); render(); toast('Đang xem: '+kidName(S,R.kids.indexOf(S))); });
  $('#famBtn').onclick=()=>go('track');
  $('#addKid').onclick=()=>{ const n=prompt('Tên bé:', 'Bé '+(R.kids.length+1)); if(n===null) return; const id=newId(), nm=n.trim()||('Bé '+(R.kids.length+1)); setMany([[`k/${id}/c`,Date.now()],[`k/${id}/p/name`,nm]]); setActive(id); const k=S; renderAgeChip(); renderHdr(); renderKids(); go('track'); toast('Đã thêm '+kidName(k,R.kids.length-1)+' — điền tuổi, cân nặng nhé'); };
}
function render(){ ({today:renderToday,cal:renderCal,track:renderTrack,guide:renderGuide})[view](); }
function go(v){ view=v; document.querySelectorAll('main>section').forEach(s=>s.classList.toggle('hidden', s.id!=='v-'+v)); document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); render(); scrollTo(0,0); }
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
async function checkHash(){
  const m=location.hash.match(/gd=([A-Za-z0-9-]+)/); if(!m) return;
  const code=m[1].toUpperCase().replace(/[^A-Z0-9]/g,''); history.replaceState(null,'',location.pathname+location.search);
  if(code!==M.fam && confirm('Mở sổ tay gia đình được chia sẻ cho bạn?\n\nMã: '+fmtCode(code))) await joinFamily(code);
}
window.addEventListener('hashchange', checkHash);
(async()=>{ refreshAll(); await checkHash(); refreshAll(); if(M.fam) sync(); })();
</script>
