<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thực Đơn Cao Lớn</title>
<meta name="description" content="Thực đơn 30 ngày tháng 11/2026 tăng chiều cao + sổ tay theo dõi thói quen và chiều cao">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#fdf1f2;--text:#2a1416;--muted:#7a5a5d;--line:#f1d5d8;
  --accent:#d0182c;--accent-ink:#ffffff;--accent-soft:#fde8ea;--warn:#b4232f;--warn-soft:#fff0e6;--danger:#b4232f;
  --hdr:#d0182c;--hdr-ink:#ffffff;
  --m0:#e8384f;--m1:#f0645a;--m2:#c4162a;--m3:#e0587a;--m4:#8e1023;
  --shadow:0 1px 2px rgba(160,20,40,.06),0 2px 10px rgba(160,20,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top .kidbar{display:flex;gap:6px;overflow-x:auto;padding-top:0;padding-bottom:10px;scrollbar-width:none}
header.top .kidbar::-webkit-scrollbar{display:none}
.kid{flex:none;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.kid.on{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
.kid.add{border-style:dashed;opacity:.9}
header.top{position:sticky;top:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);box-shadow:0 2px 8px rgba(120,0,20,.18)}
.top .brand small{color:rgba(255,255,255,.85)!important}
.top .chip{background:#fff;color:var(--accent);border-color:#fff;font-weight:600}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on span{transform:scale(1.1)}
nav.tabs{border-top:2px solid var(--accent)!important}
h2{font-size:20px;margin:18px 0 8px}
h3{font-size:16px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}
.daynav{display:flex;align-items:center;gap:10px;margin-top:14px}
.daynav .t{flex:1;text-align:center}
.daynav .t b{display:block;font-size:17px}
.daynav .t small{color:var(--muted)}
.banner{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.banner b{color:var(--accent)}
.meal{border-left:4px solid var(--c);padding:12px 14px}
.meal-h{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.meal-h h3{color:var(--c)}
.meal-h small{color:var(--muted);font-size:12px}
.dish{border-top:1px solid var(--line);padding:10px 0}
.dish:first-of-type{border-top:0}
.dish-top{display:flex;gap:10px;align-items:flex-start;width:100%;background:none;border:0;padding:0;text-align:left}
.dish-name{flex:1;font-weight:600}
.portion{flex:none;background:var(--surface2);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.dish-ingr{font-size:13px;color:var(--muted);margin-top:2px}
.note{display:none;margin-top:8px;background:var(--surface2);border-radius:10px;padding:10px;font-size:14px}
.dish.open .note{display:block}
.note b{display:block;color:var(--accent);margin-bottom:2px}
.more{font-size:12px;color:var(--accent);margin-top:4px}
.dish.open .more{display:none}
.tag-opt{font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.habits{display:grid;grid-template-columns:1fr;gap:8px}
.habit{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.habit .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--accent-ink)}
.habit.on{border-color:var(--accent);background:var(--accent-soft)}
.habit.on .box{background:var(--accent);border-color:var(--accent)}
.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cal-week{margin:14px 0}
.cal-week h3{font-size:15px;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid>*{min-width:0}
.cal-day{aspect-ratio:1/1.1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px}
.cal-day b{font-size:16px}
.cal-day.today{border:2px solid var(--accent)}
.cal-day .dots{display:flex;gap:2px}
.cal-day .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.cal-day .dots i.on{background:var(--accent)}
.cal-day.full{background:var(--accent-soft)}
.wd{font-size:11px;color:var(--muted);text-align:center}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;box-shadow:var(--shadow)}
details.acc summary{padding:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"›";margin-left:auto;transition:transform .2s;font-size:20px;color:var(--muted)}
details.acc[open] summary::after{transform:rotate(90deg)}
details.acc .body{padding:0 14px 14px}
details.acc .body p{margin:6px 0}
ul.clean{margin:6px 0;padding-left:18px}
ul.clean li{margin:4px 0}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input.in,select.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.hbar .l{width:42%;flex:none}
.hbar .progress{flex:1}
.hbar .n{width:44px;text-align:right;font-variant-numeric:tabular-nums}
.big-msg{font-size:17px;font-weight:600;text-align:center;padding:6px 0}
.shop li{display:flex;gap:8px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.code{font:600 20px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-align:center;background:var(--surface2);border:1px dashed var(--accent);border-radius:12px;padding:10px;color:var(--accent)}
.hidden{display:none!important}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:var(--shadow)}
@media print{nav.tabs,header.top,.noprint{display:none!important}body{padding:0;background:#fff}.note{display:block!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><b>🍎 Thực Đơn Cao Lớn</b><small id="hdrSub">Tháng 11/2026 · DS Vũ Đức Thắng</small></div>
  <button class="chip" id="ageChip" title="Đổi nhóm tuổi"></button>
</div><div class="wrap kidbar" id="kidbar"></div></header>

<main class="wrap">
  <section id="v-today"></section>
  <section id="v-cal" class="hidden"></section>
  <section id="v-track" class="hidden"></section>
  <section id="v-guide" class="hidden"></section>

<nav class="tabs"><div class="wrap">

</div></nav>
<div class="toast" id="toast"></div>

<script>
const DATA = {"days": [{"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin D3 từ lòng đỏ & Đạm chuẩn: Trứng gà ta là nguồn đạm có giá trị sinh học cao nhất trong tự nhiên, lòng đỏ chứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Phở bò tái chín (nước dùng ninh xương, ít muối)", "Bánh phở, thịt bò thăn thái mỏng, nước ninh xương ống, hành lá, giá", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Sắt Heme & Folate: Thịt bò cho sắt heme hấp thu gấp 3 lần sắt thực vật — quan trọng với bé gái 8-14 tuổi phòng thiếu máu. Nước ninh xương cho collagen và glycine hỗ trợ sụn. Nhắc hàng: ít muối, không nêm thêm nước mắm để giữ canxi."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Cá hồi áp chảo da giòn (ít dầu oliu)", "Cá hồi Sa Pa/Na Uy phi lê, dầu oliu, tiêu, chanh", "60g", "80g", "100g", "Vitamin D3 từ cá béo & Omega-3: Cá hồi là 'vua D3' trong thực phẩm — D3 là 'xe tải' chở canxi từ ruột vào máu. Omega-3 EPA/DHA giảm viêm đầu xương, nuôi não. Áp chảo chỉ 1 thìa dầu, không chiên ngập. 2 bữa cá béo/tuần là mục tiêu."], [2, "Đậu phụ sốt cà chua (đậu hấp, không chiên)", "Đậu phụ, cà chua, hành lá, tỏi, dầu oliu", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Canxi thực vật: Đậu phụ cho đạm thực vật, canxi (nếu đông bằng nigari/thạch cao), isoflavone và magie — phần 30% đạm thực vật trong nguyên tắc 70/30. Hấp hoặc nấu trực tiếp với sốt cà, không chiên để tránh dầu."], [2, "Canh rau ngót nấu thịt nạc băm", "Rau ngót, thịt nạc băm, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin C & Canxi thực vật: Rau ngót là rau giàu đạm thực vật, canxi, vitamin C và K — tốt cho xương và miễn dịch. Thịt nạc băm cho đạm. Canh quen thuộc, nấu nhạt."], [2, "Súp lơ xanh hấp rưới dầu mè, mè rang", "Súp lơ xanh, dầu mè, mè rang", "100g", "150g", "200g", "Vitamin K2 & Sulforaphane: Súp lơ xanh hấp giữ sulforaphane chống viêm, vitamin K, C; dầu mè + mè rang cho K2 và canxi. Món rau 'vàng' cho xương."], [2, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạt óc chó (bóc sẵn, ăn với sữa)", "Óc chó nguyên hạt, không muối, không tẩm đường", "3-5 hạt", "5-8 hạt", "8-10 hạt", "DHA/EPA thực vật: Óc chó là hạt giàu omega-3 (ALA) nhất, hỗ trợ phát triển não và giảm viêm ở đầu xương. Kèm magie, kẽm và đồng — bộ khoáng cho tạo xương. Nhai kỹ từng hạt; bé nhỏ nên bẻ nhỏ để tránh hóc."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Nghêu hấp sả (lấy nước làm canh)", "Nghêu Bến Tre, sả, gừng, hành lá", "8-10 con", "12-15 con", "15-20 con", "Combo Magie & Sắt: Nghêu cực giàu sắt, magie, kẽm, B12 — rất hợp buổi tối để magie giúp ngủ sâu. Hấp sả 5 phút là chín, không dầu. Nước hấp nghêu ngọt dùng nấu canh rau."], [4, "Cải xanh luộc chấm mè rang", "Cải xanh (cải bẹ), mè rang", "100g", "150g", "200g", "Vitamin K2 (MK7) kép: Cải xanh đậm + mè rang — hai nguồn K2 trong một đĩa, đưa canxi từ các bữa trong ngày gắn vào xương trong lúc ngủ. Luộc nhanh giữ màu."], [4, "Canh cua đồng mồng tơi mướp", "Cua đồng giã lọc, mồng tơi, mướp hương, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie ru ngủ: Cua đồng + mồng tơi là 'cặp đôi magie' kinh điển — magie giúp giãn cơ, ngủ sâu, kích hoạt vitamin D và dẫn canxi vào xương. Cua đồng còn cho canxi tự nhiên rất cao. Bát canh tối hoàn hảo cho GH tiết mạnh 22h-2h."], [4, "Đậu phụ hấp rắc mè rang hành lá", "Đậu phụ, mè rang, hành lá, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & K2 từ mè: Đậu phụ hấp rắc mè rang — đạm thực vật + canxi + K2 trong một món nhẹ. Không chiên. Món phụ tối lý tưởng."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm chuẩn & Choline nuôi não: 1 quả trứng cho ~6-7g đạm hoàn chỉnh với đủ 9 acid amin thiết yếu — nguyên liệu trực tiếp để xây mô xương và sụn. Choline trong lòng đỏ hỗ trợ trí nhớ, giúp con học tập tỉnh táo cả buổi sáng. Ăn trước 7h30 để cortisol không tăng cao, GH được bảo vệ."], [0, "Cháo yến mạch nấu sữa, rắc hạt chia", "Yến mạch cán dẹt, sữa tươi không đường, chuối chín thái lát, hạt chia", "3 thìa canh", "4 thìa canh", "5 thìa canh", "Beta-glucan tăng đề kháng: Yến mạch là tinh bột chậm hàng đầu, beta-glucan giúp đường huyết ổn định, tăng miễn dịch mùa lạnh. Nấu với sữa tươi cho canxi; chuối cho magie; hạt chia cho omega-3 và canxi thực vật. Bữa sáng ấm, nhanh gọn cho ngày gió mùa."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", "Vitamin C & Chất xơ hoà tan: Bưởi Diễn Hà Nội vào chính vụ tháng 11-12, múi khô ráo, ngọt đậm. Chất xơ pectin giúp no lâu, ổn định đường huyết; vitamin C hỗ trợ tạo collagen cho sụn tăng trưởng. Bé dư cân rất nên ăn bưởi thay vì trái cây ngọt đậm."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Sườn non xào chua ngọt (sốt cà chua tươi, không đường tinh luyện)", "Sườn non chặt miếng, cà chua tươi, dứa, hành tây, tỏi", "60g (~2 dẻ)", "80g (~3 dẻ)", "100g (~4 dẻ)", "Collagen & Vitamin C hỗ trợ: Sườn non cho đạm, collagen và kẽm; vị chua ngọt tự nhiên từ dứa và cà chua thay vì đường — tránh insulin tăng. Xào ít dầu, không chiên sườn trước. Món 'ruột' của bé mà vẫn đúng nguyên tắc."], [2, "Đậu que xào tỏi (xào nhanh)", "Đậu que (đậu cô ve), tỏi, dầu oliu", "100g", "150g", "200g", "Đạm thực vật & Folate: Đậu que cho đạm thực vật, folate, vitamin K và xơ. Xào nhanh tỏi giữ giòn xanh. Vừa là rau vừa góp đạm thực vật cho tỉ lệ 70/30."], [2, "Canh bí đỏ nấu tôm tươi", "Bí đỏ, tôm tươi băm, hành lá", "1 chén", "1 tô nhỏ", "1 tô vừa", "Beta-caroten & Magie: Bí đỏ cho beta-caroten, kali, magie; tôm cho canxi, kẽm. Canh ngọt tự nhiên không cần đường. Màu cam hấp dẫn bé nhỏ."], [2, "Cải ngọt xào tỏi", "Cải ngọt, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K & Canxi thực vật: Cải ngọt — rau xanh đậm mùa đông — giàu vitamin K, C, canxi. Xào tỏi nhanh. Cấp K2 cho bữa tối theo nguyên tắc."], [2, "Đu đủ chín (gọt, cắt miếng)", "Đu đủ chín cây, bỏ hạt", "100g", "150g", "200g", "Enzyme Papain & Beta-caroten: Đu đủ giúp tiêu hoá đạm, giảm táo bón — điều kiện cần để hấp thu khoáng chất. Giàu beta-caroten, vitamin C, folate hỗ trợ tạo máu và tăng trưởng. Quả quanh năm, giá rẻ, rất hợp bữa phụ sáng."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt điều rang mộc", "Hạt điều Bình Phước rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Siêu Kẽm (Zinc): Hạt điều là hạt giàu kẽm hàng đầu — kẽm kích thích tuyến yên tiết GH và tham gia phân chia tế bào xương. Thêm magie, sắt, đồng. Bữa phụ chiều có hạt điều + sữa tươi là 'combo đánh thức GH' trước giấc ngủ đêm."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá thu nướng giấy bạc gừng hành", "Cá thu khúc, gừng, hành lá, dầu oliu, chanh", "60g", "80g", "100g", "Vitamin D3 từ cá béo: Cá thu nướng giấy bạc giữ trọn D3, omega-3, selen — không khét, không dầu. Buổi tối có cá béo + rau K2 là 'cặp đôi vàng': D3 đưa canxi vào máu, K2 khoá canxi vào xương trong giấc ngủ."], [4, "Bông cải xanh hấp chấm mè rang", "Bông cải xanh, mè rang giã, chút muối", "100g", "150g", "200g", "Vitamin K2 (MK7) & Canxi thực vật: Bông cải xanh là rau xanh đậm giàu vitamin K, C, canxi; mè rang thêm canxi và K2. Hấp 3-4 phút giữ màu xanh và vitamin. 'Rau + mè' là công thức K2 cho bữa tối."], [4, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [4, "Trứng cút luộc (3-5 quả)", "Trứng cút, luộc chín", "3 quả", "4 quả", "5 quả", "Vitamin D3 & Choline: Trứng cút nhỏ nhưng giàu D3, B12, choline, sắt. Luộc chín, dễ ăn. Món phụ tối góp D3 cho 'xe tải' chở canxi."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin K2 (MK7) & D3 tự nhiên: Lòng đỏ trứng gà ta thả vườn là một trong số ít thực phẩm hàng ngày chứa cả D3 lẫn K2 — D3 giúp ruột hút canxi vào máu, K2 dẫn canxi gắn vào xương. Một quả trứng mỗi sáng là thói quen rẻ nhất nhưng hiệu quả nhất cho chiều cao."], [0, "Bún cá rô đồng Hà Nội", "Cá rô đồng rán/hấp gỡ xương, bún, rau cải, thì là, nước dùng xương cá", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Đạm trắng & Canxi vi lượng: Cá rô đồng là đặc sản Bắc Bộ, đạm dễ tiêu, giàu canxi và phốt-pho. Rau cải xanh trong bát bún bổ sung K2 và vitamin C. Nước dùng từ xương cá ninh kỹ cho khoáng chất hoà tan. Chọn cách hấp/áp chảo thay vì chiên ngập dầu."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Kiwi (bổ đôi, nạo thìa)", "Kiwi xanh hoặc vàng chín mềm", "1 quả", "1 quả", "1-2 quả", "Vitamin C & Actinidin: 1 quả kiwi cho hơn 100% nhu cầu vitamin C/ngày, hỗ trợ tổng hợp collagen và hấp thu sắt. Enzyme actinidin giúp tiêu hoá đạm của bữa sáng dễ dàng. Kiwi còn giàu vitamin K và kali — cặp đôi bảo vệ mật độ xương."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Gà ta kho gừng (kho nhạt, không đường)", "Đùi gà ta bỏ da, gừng, hành tím, nước mắm ít, tiêu", "50g", "70g", "90g", "Đạm nạc & Gừng ấm: Gà ta bỏ da là đạm nạc giàu B6, niacin; kho với gừng làm ấm người ngày gió mùa. Kho nhạt — không đường, ít mắm — để không mất canxi qua nước tiểu. Nước kho sánh tự nhiên từ gừng và mỡ gà."], [2, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."], [2, "Canh su hào cà rốt nấu tôm khô", "Su hào, cà rốt, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin C & Canxi: Su hào mùa đông giàu vitamin C, kali; cà rốt cho vitamin A; tôm khô cho canxi. Canh rau củ ngọt thanh, bé thích."], [2, "Cải bó xôi xào tỏi (xào nhanh, ít dầu)", "Cải bó xôi, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 & Magie: Cải bó xôi cực giàu vitamin K, magie, sắt, folate — K khoá canxi vào xương, magie ru ngủ. Xào tỏi nhanh ít dầu. Rau xanh đậm là bắt buộc trong bữa tối."], [2, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạnh nhân rang mộc", "Hạnh nhân rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Canxi thực vật & Vitamin E: 10 hạt hạnh nhân cho ~30mg canxi và magie — nằm trong 30% canxi thực vật của nguyên tắc 70/30. Vitamin E bảo vệ màng tế bào sụn. Kết hợp sữa tươi tạo bữa phụ chiều đủ đạm-béo tốt."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Tôm hấp nước dừa sả", "Tôm sú, nước dừa, sả, hành lá", "5-6 con", "7-8 con", "9-10 con", "Canxi nguyên khối & Điện giải: Tôm hấp giữ nguyên canxi, kẽm, i-ốt; nước dừa cho kali, magie — điện giải tự nhiên. Không dầu, không đường. Bé lớn ăn cả vỏ tôm nhỏ để thêm canxi và chitin tốt cho ruột."], [4, "Cải thìa hấp dầu mè tỏi", "Cải thìa, dầu mè, tỏi, xì dầu ít muối", "100g", "150g", "200g", "Vitamin K2 & Canxi: Cải thìa là cải xanh đậm giàu canxi (hấp thu tốt hơn cải bó xôi vì ít oxalat), vitamin K. Hấp rưới dầu mè — K2 cho bữa tối."], [4, "Canh ngao nấu chua cà chua dứa", "Ngao, cà chua, dứa, dọc mùng, thì là, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ ngao: Ngao giàu magie, sắt, B12 — tối ăn ngao giúp ngủ sâu và tạo máu. Cà chua, dứa cho vitamin C hấp thu sắt. Nấu chua nhẹ, không đường, không mì chính."], [4, "Nấm hương, nấm kim châm xào tỏi", "Nấm hương, nấm kim châm, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin D2 & Beta-glucan: Nấm là nguồn D2 thực vật, beta-glucan tăng đề kháng mùa lạnh. Xào tỏi nhanh. Góp D cho xương, ít calo."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm hoàn chỉnh & Lutein: Trứng cung cấp đạm dễ tiêu, lutein và zeaxanthin bảo vệ mắt cho con học bài, xem bảng. Lòng đỏ giàu vitamin A, B12, selen hỗ trợ tăng trưởng và miễn dịch mùa gió mùa Đông Bắc. Nhai kỹ, ăn chậm để hấp thu tối đa."], [0, "Bánh mì nguyên cám kẹp ức gà áp chảo & rau xà lách", "Bánh mì nguyên cám, ức gà áp chảo ít dầu, xà lách, cà chua, chút bơ lạt", "1 lát", "1-2 lát", "2 lát", "Tinh bột chậm & Đạm nạc: Bánh mì nguyên cám giữ lớp cám giàu B1, magie, xơ — đường giải phóng từ từ. Ức gà là đạm nạc hoàn chỉnh, ít béo. Combo này hợp bé dư cân: no lâu, không tăng insulin đột ngột."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Chuối chín (ăn tươi)", "Chuối tiêu/chuối sứ chín vàng", "1/2 quả", "1 quả", "1 quả", "Combo Magie & Kali: Chuối là nguồn magie quanh năm, giúp kích hoạt vitamin D và điều phối canxi vào đúng xương. Kali bù điện giải sau vận động. Carb tự nhiên của chuối cho năng lượng bền cho buổi học. Dùng ở bữa phụ trước 18h."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Thịt bò xào bông cải xanh (xào nhanh lửa lớn)", "Thịt bò thăn thái mỏng, bông cải xanh, tỏi, dầu oliu, chút dầu hào", "50g", "70g", "90g", "Sắt Heme & Siêu Kẽm: Thịt bò là nguồn kẽm và sắt heme hàng đầu — kẽm kích GH, sắt tạo máu. Bông cải xanh cho vitamin K, C và canxi thực vật, vitamin C giúp hấp thu sắt tốt hơn. Xào nhanh lửa lớn giữ bò mềm, rau giòn."], [2, "Natto (đậu tương lên men) trộn xì dầu, hành", "Natto Nhật, xì dầu ít muối, hành lá, chút mù tạt (bé lớn)", "1/2 hộp", "1 hộp", "1 hộp", "Vitamin K2 (MK7): Natto là thực phẩm giàu K2-MK7 nhất thế giới — 1 hộp nhỏ cho lượng K2 gấp hàng chục lần phô mai. K2 là 'người lái xe' đưa canxi gắn thẳng vào xương. Tập cho con ăn từ nửa hộp, trộn cơm nóng."], [2, "Canh bí xanh nấu sườn non", "Bí xanh, sườn non, hành, mùi", "1 chén", "1 tô nhỏ", "1 tô vừa", "Collagen & Kali: Sườn non ninh cho collagen và canxi; bí xanh mát, nhiều nước và kali, giúp thải muối. Canh nhẹ, ngọt tự nhiên, hớt mỡ, nêm nhạt."], [2, "Cà rốt su hào luộ ứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Cháo lươn Nghệ An (lươn xào nghệ, ít cay)", "Lươn đồng làm sạch xào nghệ, gạo tẻ, hành phi, rau răm, không ớt", "1 bát", "1 bát đầy", "1.5 bát", "Đạm trắng & Vitamin A: Lươn là 'nhân sâm nước ngọt' — đạm cao, giàu vitamin A, B12, DHA và kẽm. Nghệ chống viêm, tốt cho dạ dày. Cháo lươn ấm nóng ngày gió mùa giúp con tỉnh táo, no lâu. Bỏ ớt với bé nhỏ."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Thanh long (cắt miếng)", "Thanh long ruột đỏ hoặc trắng", "100g", "150g", "200g", "Chất xơ & Betalain: Thanh long ít đường, nhiều xơ và nước, phù hợp bé dư cân. Hạt đen nhỏ chứa omega-3 và magie. Sắc tố betalain ở ruột đỏ chống oxy hoá, bảo vệ tế bào sụn. Dùng bữa phụ, không ăn tối."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Tôm rim nước dừa (bóc vỏ, không đường)", "Tôm sú/tôm đất, nước dừa tươi, hành tím, tiêu", "5-6 con", "7-8 con", "9-10 con", "Canxi nguyên khối & Kẽm: Tôm cho canxi, phốt-pho, kẽm, selen và đạm trắng dễ tiêu. Rim nước dừa tạo vị ngọt tự nhiên, không thêm đường. Bé nhỏ bóc vỏ sẵn; bé lớn ăn cả vỏ tôm đất để thêm canxi."], [2, "Đậu phụ nhồi thịt nấm hấp", "Đậu phụ, thịt nạc băm, nấm mèo, hành, hấp chín", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm 70/30 trong một món: Đậu phụ (thực vật) + thịt nạc (động vật) nhồi hấp — đúng tỉ lệ đạm động-thực vật. Nấm mèo cho sắt và xơ. Hấp không dầu, mềm dễ ăn, bé nhỏ rất thích."], [2, "Canh cải cúc (tần ô) nấu thịt nạc băm", "Cải cúc, thịt nạc băm, gừng, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & Kali từ rau mùa đông: Cải cúc là rau đặc trưng mùa đông Hà Nội, giàu vitamin K, kali, carotenoid, giúp ngủ ngon, giảm ho. Nấu thịt băm nhẹ, ấm người."], [2, "Su su xào tỏi", "Su su, tỏi, dầu oliu", "100g", "150g", "200g", "Folate & Vitamin C: Su su mùa đông giòn ngọt, giàu folate, vitamin C, kali, ít calo. Xào tỏi nhanh. Bé thích vị ngọt giòn."], [2, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp )", "Hồng giòn Đà Lạt/Mộc Châu cuối vụ, chọn quả đã hết chát", "100g", "150g", "200g", "Beta-caroten & Mangan: Hồng giòn cuối thu giàu beta-caroten (tiền vitamin A) bảo vệ mắt, niêm mạc hô hấp mùa lạnh; mangan tham gia tạo sụn và collagen xương. Ăn lượng vừa phải vì hồng có tannin — không ăn lúc đói."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Cá thu sốt cà chua (áp chảo nhẹ rồi sốt)", "Cá thu khúc, cà chua tươi, hành tây, tỏi, thì là, dầu oliu", "60g", "80g", "100g", "Vitamin D3 từ cá béo & DHA: Cá thu là cá biển béo giàu D3, DHA, selen — bộ ba cho xương và não. Sốt cà chua cho lycopene và vitamin C. Áp chảo nhẹ 1 thìa dầu rồi sốt, không chiên giòn ngập dầu."], [2, "Đậu Hà Lan xào cà rốt nấm", "Đậu Hà Lan hạt, cà rốt hạt lựu, nấm, tỏi", "50g", "70g", "90g", "Đạm thực vật & Beta-caroten: Đậu Hà Lan cho đạm thực vật, B1, kẽm, magie; cà rốt cho vitamin A; nấm cho D2. Món xào màu sắc, bé nhỏ thích, ít dầu."], [2, "Canh xương hầm củ (cà rốt, su hào, khoai tây — ninh nhạt)", "Xương ống/sườn, cà rốt, su hào, khoai tây, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Collagen & Khoáng củ mùa đông: Xương ninh kỹ cho collagen, glycine; su hào mùa đông cho vitamin C, kali; cà rốt cho vitamin A. Ninh nhạt, hớt mỡ. Bát canh ấm ngày rét."], [2, "Rau lang luộc chấm mè", "Ngọn rau lang, mè rang, muối mè ít muối", "100g", "150g", "200g", "Chất xơ & K2 từ mè: Rau lang giàu xơ, vitamin B6, C; luộc chấm mè rang cho canxi và K2. Chống táo bón — ruột thông thì hấp thu khoáng tốt."], [2, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nướ Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Bò bít-tết áp chảo (thăn bò, medium, không sốt đóng hộp)", "Thăn bò, tiêu, bơ lạt chút, tỏi, khoai tây hấp kèm", "50g", "70g", "90g", "Sắt Heme & Creatine: Thăn bò áp chảo vừa chín giữ sắt heme, kẽm, B12 và creatine tự nhiên cho cơ bắp khoẻ — cơ khoẻ kéo xương dài. Không dùng sốt đóng hộp nhiều muối, chỉ tiêu và chút bơ lạt. Bữa 'sang' cuối tuần cho con."], [2, "Đậu bắp luộc chấm mè rang", "Đậu bắp non, mè rang, muối mè ít muối", "100g", "150g", "200g", "Canxi thực vật & Chất nhầy: Đậu bắp giàu canxi, magie, folate, vitamin K; chất nhầy bảo vệ niêm mạc ruột, giúp hấp thu tốt. Chấm mè rang cho K2 và thêm canxi."], [2, "Canh súp lơ cà rốt nấu thịt viên", "Súp lơ xanh/trắng, cà rốt, thịt nạc viên, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & C: Súp lơ xanh cho K, C, canxi thực vật; cà rốt cho vitamin A; thịt viên cho đạm. Canh rau củ đầy màu sắc cho bé nhỏ."], [2, "Salad rau xà lách cà chua bi dầu oliu (không sốt mayonnaise)", "Xà lách, cà chua bi, dưa chuột, dầu oliu, chanh", "100g", "150g", "200g", "Vitamin K & Chất béo tốt: Xà lách cho vitamin K, folate; cà chua bi cho vitamin C, lycopene; dầu oliu giúp hấp thu vitamin tan trong dầu. Không dùng mayonnaise/sốt đóng chai."], [2, "Kiwi (bổ đôi, nạo thìa)", "Kiwi xanh hoặc vàng chín mềm", "1 quả", "1 quả", "1-2 quả", "Vitamin C & Actinidin: 1 quả kiwi cho hơn 100% nhu cầu vitamin C/ngày, hỗ trợ tổng hợp collagen và hấp thu sắt. Enzyme actinidin giúp tiêu hoá đạm của bữa sáng dễ dàng. Kiwi còn giàu vitamin K và kali — cặp đôi bảo vệ mật độ xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt bí xanh rang mộc", "Hạt bí ngô tách vỏ, rang không muối", "1 thìa canh", "1.5 thìa", "2 thìa", "Siêu Kẽm & Magie: 1 thìa hạt bí cho lượng kẽm và magie rất cao so với kích thước — kẽm cho GH, magie cho giấc ngủ sâu. Hạt mềm, dễ nhai, phù hợp cả bé 6 tuổi. Có thể rắc lên sữa chua hoặc ăn kèm sữa tươi."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá diêu hồng hấp xì dầu gừng hành", "Cá diêu hồng nguyên con, gừng, hành lá, xì dầu ít muối, dầu mè", "60g", "80g", "100g", "Đạm trắng & Canxi vi lượng: Cá diêu hồng thịt trắng ngọt, dễ gỡ xương, giàu đạm, phốt-pho, selen. Hấp xì dầu kiểu Quảng Đông giữ nguyên dưỡng chất; chút dầu mè cuối cùng thêm hương và K2. Món cả nhà cùng ăn ngày cuối tuần."], [4, "Cải bó xôi xào tỏi (xào nhanh, ít dầu)", "Cải bó xôi, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 & Magie: Cải bó xôi cực giàu vitamin K, magie, sắt, folate — K khoá canxi vào xương, magie ru ngủ. Xào tỏi nhanh ít dầu. Rau xanh đậm là bắt buộc trong bữa tối."], [4, "Canh cua đồng mồng tơi mướp", "Cua đồng giã lọc, mồng tơi, mướp hương, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie ru ngủ: Cua đồng + mồng tơi là 'cặp đôi magie' kinh điển — magie giúp giãn cơ, ngủ sâu, kích hoạt vitamin D và dẫn canxi vào xương. Cua đồng còn cho canxi tự nhiên rất cao. Bát canh tối hoàn hảo cho GH tiết mạnh 22h-2h."], [4, "Nấm hương, nấm kim châm xào tỏi", "Nấm hương, nấm kim châm, tỏi, dầu oliu", "50g", "70g", "90g", "Vitamin D2 & Beta-glucan: Nấm là nguồn D2 thực vật, beta-glucan tăng đề kháng mùa lạnh. Xào tỏi nhanh. Góp D cho xương, ít calo."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin D3 từ lòng đỏ & Đạm chuẩn: Trứng gà ta là nguồn đạm có giá trị sinh học cao nhất trong tự nhiên, lòng đỏ chứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Cháo gà ta xé, hành lá, gừng", "Gạo tẻ, gà ta luộc xé, nước luộc gà, gừng, hành lá, tiêu", "1 bát", "1 bát đầy", "1.5 bát", "Đạm nạc & Gừng ấm: Thịt gà ta là đạm nạc ít béo, giàu B6 hỗ trợ chuyển hoá đạm. Gừng làm ấm cơ thể, tăng tuần hoàn ngày lạnh, giảm cảm. Cháo nấu từ nước luộc gà cho glycine hỗ trợ sụn. Món sáng dễ tiêu cho bé hay đầy bụng."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Cá basa kho tiêu (kho nhạt, không đường)", "Cá basa khúc, tiêu xanh, hành tím, nước dừa, ít mắm", "60g", "80g", "100g", "Đạm trắng & Omega-3: Cá basa miền Tây thịt mềm, ít xương, giàu đạm và DHA, giá dễ chịu. Kho tiêu với nước dừa cho vị ngọt tự nhiên — không đường, ít mắm. Món cơm nhà phương Nam, bé nhỏ rất dễ ăn."], [2, "Đậu que xào tỏi (xào nhanh)", "Đậu que (đậu cô ve), tỏi, dầu oliu", "100g", "150g", "200g", "Đạm thực vật & Folate: Đậu que cho đạm thực vật, folate, vitamin K và xơ. Xào nhanh tỏi giữ giòn xanh. Vừa là rau vừa góp đạm thực vật cho tỉ lệ 70/30."], [2, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [2, "Cải ngọt xào tỏi", "Cải ngọt, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K & Canxi thực vật: Cải ngọt — rau xanh đậm mùa đông — giàu vitamin K, C, canxi. Xào tỏi nhanh. Cấp K2 cho bữa tối theo nguyên tắc."], [2, "Chuối chín (ăn tươi)", "Chuối tiêu/chuối sứ chín vàng", "1/2 quả", "1 quả", "1 quả", "Combo Magie & Kali: Chuối là nguồn magie quanh năm, giúp kích hoạt vitamin D và điều phối canxi vào đúng xương. Kali bù điện giải sau vận động. Carb tự nhiên của chuối cho năng lượng bền cho buổi học. Dùng ở bữa phụ trước 18h."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạnh nhân rang mộc", "Hạnh nhân rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Canxi thực vật & Vitamin E: 10 hạt hạnh nhân cho ~30mg canxi và magie — nằm trong 30% canxi thực vật của nguyên tắc 70/30. Vitamin E bảo vệ màng tế bào sụn. Kết hợp sữa tươi tạo bữa phụ chiều đủ đạm-béo tốt."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Tôm xào súp lơ xanh tỏi", "Tôm bóc vỏ, súp lơ xanh, tỏi, dầu oliu", "5-6 con", "7-8 con", "9-10 con", "Canxi & Vitamin K2 thực vật: Tôm cho canxi, kẽm; súp lơ xanh là rau xanh đậm giàu vitamin K, C, canxi thực vật. Xào nhanh ít dầu. Một món vừa đạm vừa rau K — gọn cho bữa tối."], [4, "Cải xanh luộc chấm mè rang", "Cải xanh (cải bẹ), mè rang", "100g", "150g", "200g", "Vitamin K2 (MK7) kép: Cải xanh đậm + mè rang — hai nguồn K2 trong một đĩa, đưa canxi từ các bữa trong ngày gắn vào xương trong lúc ngủ. Luộc nhanh giữ màu."], [4, "Canh hến nấu mướp hành", "Hến (Huế), mướp, hành, rau răm", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ hến: Hến rất giàu sắt, magie, kẽm, B12 — nhỏ mà 'có võ'. Nấu mướp ngọt mát. Canh tối giàu magie giúp con ngủ sâu, phòng thiếu máu bé gái."], [4, "Đậu phụ hấp rắc mè rang hành lá", "Đậu phụ, mè rang, hành lá, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & K2 từ mè: Đậu phụ hấp rắc mè rang — đạm thực vật + canxi + K2 trong một món nhẹ. Không chiên. Món phụ tối lý tưởng."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm chuẩn & Choline nuôi não: 1 quả trứng cho ~6-7g đạm hoàn chỉnh với đủ 9 acid amin thiết yếu — nguyên liệu trực tiếp để xây mô xương và sụn. Choline trong lòng đỏ hỗ trợ trí nhớ, giúp con học tập tỉnh táo cả buổi sáng. Ăn trước 7h30 để cortisol không tăng cao, GH được bảo vệ."], [0, "Yến mạch ngâm sữa qua đêm (overnight oats) với hạt bí & táo", "Yến mạch, sữa tươi không đường, sữa chua, táo thái hạt lựu, hạt bí, quế", "3 thìa canh", "4 thìa canh", "5 thìa canh", "Tinh bột chậm & Siêu Kẽm: Yến mạch ngâm qua đêm mềm, giải phóng đường rất chậm; hạt bí cho kẽm và magie; táo cho xơ. Chuẩn bị tối hôm trước, sáng chỉ lấy ra ăn — hợp gia đình bận rộn vẫn giữ nguyên tắc ăn sáng trước 7h30."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Bưởi Diễn (bóc múi ăn tươi)", "Bưởi Diễn chín vàng, ăn múi", "100g", "150g", "200g", " o bón."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt óc chó (bóc sẵn, ăn với sữa)", "Óc chó nguyên hạt, không muối, không tẩm đường", "3-5 hạt", "5-8 hạt", "8-10 hạt", "DHA/EPA thực vật: Óc chó là hạt giàu omega-3 (ALA) nhất, hỗ trợ phát triển não và giảm viêm ở đầu xương. Kèm magie, kẽm và đồng — bộ khoáng cho tạo xương. Nhai kỹ từng hạt; bé nhỏ nên bẻ nhỏ để tránh hóc."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá hồi nướng giấy bạc với bông cải xanh", "Cá hồi phi lê, bông cải xanh, hành tây, dầu oliu, tiêu, chanh", "60g", "80g", "100g", "Vitamin D3 & K2 trong một món: Cá hồi cho D3 + omega-3, bông cải xanh cho K và canxi thực vật — nướng cùng giấy bạc giữ nước, không cần dầu. D3 chở canxi vào máu, K2 'lái' canxi vào xương: hai bước xong trong một món."], [4, "Cải xoăn (kale) xào tỏi dầu oliu", "Cải xoăn, tỏi, dầu oliu, chút chanh", "100g", "150g", "200g", "Vitamin K2 & Canxi thực vật: Cải xoăn là 'siêu rau' giàu vitamin K nhất, canxi hấp thu tốt, lutein. Xào tỏi nhanh, vắt chút chanh. K2 cho bữa tối."], [4, "Canh ngao nấu chua cà chua dứa", "Ngao, cà chua, dứa, dọc mùng, thì là, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt từ ngao: Ngao giàu magie, sắt, B12 — tối ăn ngao giúp ngủ sâu và tạo máu. Cà chua, dứa cho vitamin C hấp thu sắt. Nấu chua nhẹ, không đường, không mì chính."], [4, "Trứng cút luộc (3-5 quả)", "Trứng cút, luộc chín", "3 quả", "4 quả", "5 quả", "Vitamin D3 & Choline: Trứng cút nhỏ nhưng giàu D3, B12, choline, sắt. Luộc chín, dễ ăn. Món phụ tối góp D3 cho 'xe tải' chở canxi."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin K2 (MK7) & D3 tự nhiên: Lòng đỏ trứng gà ta thả vườn là một trong số ít thực phẩm hàng ngày chứa cả D3 lẫn K2 — D3 giúp ruột hút canxi vào máu, K2 dẫn canxi gắn vào xương. Một quả trứng mỗi sáng là thói quen rẻ nhất nhưng hiệu quả nhất cho chiều cao."], [0, "Bún mọc (mọc nấm hương, sườn non)", "Bún, mọc giò sống + nấm hương, sườn non, dọc mùng, nước xương ninh", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Đạm & Vitamin D2 từ nấm hương: Nấm hương là nguồn D2 thực vật hiếm có, hỗ trợ hấp thu canxi. Sườn non ninh kỹ cho collagen; mọc cho đạm dễ ăn. Dọc mùng giàu xơ. Nêm nhạt, bỏ ớt — bát bún ấm cho ngày gió mùa về."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường, hâm ấm 40°C vào ngày lạnh", "180ml", "200ml", "240ml", "Đạm whey & Casein: Sữa tươi cung cấp 2 loại đạm bổ trợ nhau — whey hấp thu nhanh, casein hấp thu chậm — giữ dòng acid amin ổn định cho xương suốt buổi sáng. Chọn sữa KHÔNG đường, không sữa trái cây; đường thêm vào làm tăng insulin và cản GH."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics & Canxi lên men: Quá trình lên men biến lactose thành acid lactic, giúp canxi trong sữa chua hấp thu tốt hơn cả sữa tươi, phù hợp cả bé hay đầy bụng khi uống sữa. Lợi khuẩn còn giảm táo bón, tăng đề kháng mùa lạnh."], [1, "Hồng treo gió (ăn 1-2 quả nhỏ)", "Hồng treo gió Đà Lạt, loại sấy tự nhiên không đường", "1 quả nhỏ", "1-2 quả", "2 quả", "Chất xơ & Kali: Hồng treo gió là đặc sản tháng 11, vị ngọt tự nhiên cô đặc nên chỉ dùng 1-2 quả nhỏ như 'phần thưởng' bữa phụ. Kali giúp cân bằng điện giải, giảm mất canxi qua thận. Ăn kèm sữa chua không đường để giảm tốc độ hấp thu đường."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Ức gà áp chảo sả (ướp sả, tỏi, tiêu, ít dầu)", "Ức gà, sả băm, tỏi, tiêu, dầu oliu", "50g", "70g", "90g", "Đạm nạc tinh khiết: Ức gà là đạm nạc nhất (31g đạm/100g, gần như không mỡ), giàu niacin, B6, selen. Ướp sả tỏi cho thơm, áp chảo 1 thìa dầu. Lý tưởng cho bé dư cân cần nhiều đạm, ít năng lượng."], [2, "Natto (đậu tương lên men) trộn xì dầu, hành", "Natto Nhật, xì dầu ít muối, hành lá, chút mù tạt (bé lớn)", "1/2 hộp", "1 hộp", "1 hộp", "Vitamin K2 (MK7): Natto là thực phẩm giàu K2-MK7 nhất thế giới — 1 hộp nhỏ cho lượng K2 gấp hàng chục lần phô mai. K2 là 'người lái xe' đưa canxi gắn thẳng vào xương. Tập cho con ăn từ nửa hộp, trộn cơm nóng."], [2, "Canh cải thảo cuộn thịt hấp nước dùng gà", "Cải thảo, thịt nạc băm, nấm, nước luộc gà", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K & Folate: Cải thảo cho vitamin K, C, folate; thịt nạc cho đạm; nước luộc gà cho glycine. Canh cuộn đẹp mắt, cách làm mới cho bé thích ăn rau."], [2, "Rau củ hấp (bông cải, cà rốt, đậu que) rắc mè rang", "Bông cải xanh, cà rốt, đậu que, mè rang, dầu mè", "100g", "150g", "200g", "Vitamin K2 & Đa màu sắc: Hấp 3 loại rau củ giữ vitamin; mè rang cho canxi, K2. Đĩa rau nhiều màu giúp bé ăn rau vui vẻ, góp 3 loại thực phẩm."], [2, "Quýt hồng (bóc ăn tươi)", "Quýt hồng Lai Vung/quýt đường chín mọng", "100g", "150g", "200g", "Vitamin C & Anthocyanin: Quýt hồng vào mùa tháng 11, ngọt thanh, vỏ mỏng, vitamin C cao giúp tăng hấp thu sắt từ bữa trưa và tăng đề kháng mùa gió mùa. Hesperidin trong múi quýt hỗ trợ thành mạch khoẻ, tuần hoàn tốt đưa dưỡng chất tới đầu xương."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g (loại ít muối), ăn sau bữa trưa", "1 miếng", "1-2 miếng", "2 miếng", "Vitamin K2 (MK7): Phô mai là nguồn K2 tự nhiên tiện lợi nhất — 'người lái xe' đưa canxi từ máu gắn vào xương, không lắng đọng ở mạch máu. 1 miếng 15g = 1 đơn vị sữa, giúp nhóm từ 10 tuổi đủ 6 đơn vị/ngày. Nhóm 6-9 tuổi có thể bỏ qua."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, uống lúc 15h30-16h", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: Đây là mốc sữa CUỐI CÙNG trong ngày — xong trước 18h để tối đi ngủ bụng nhẹ, GH tiết mạnh 22h-2h. Uống sau giờ học/vận động giúp bù đạm và nước cho cơ xương. 2 đơn vị sữa."], [3, "Hạt điều rang mộc", "Hạt điều Bình Phước rang không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Siêu Kẽm (Zinc): Hạt điều là hạt giàu kẽm hàng đầu — kẽm kích thích tuyến yên tiết GH và tham gia phân chia tế bào xương. Thêm magie, sắt, đồng. Bữa phụ chiều có hạt điều + sữa tươi là 'combo đánh thức GH' trước giấc ngủ đêm."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ. Bé dư cân: áp dụng 4-2-0 (bỏ cơm, ăn đạm + rau). Bé thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Nguyên tắc 4-2-0 buổi tối: Bé dư cân bỏ tinh bột buổi tối để đường huyết đêm thấp, insulin không ức chế GH lúc ngủ sâu 22h-2h. Bé cân nặng chuẩn giữ lượng cơm nhỏ; bé thiếu cân vẫn cần chút tinh bột. Dù thế nào, ăn xong trước 19h30 và đi ngủ với bụng 'hơi đói nhẹ'."], [4, "Mực hấp gừng sả", "Mực ống tươi, gừng, sả, hành lá, chấm nước mắm gừng loãng", "60g", "80g", "100g", "Đạm trắng & Đồng (Cu): Mực giàu đạm, ít béo, nhiều đồng và selen — đồng cần cho tổng hợp collagen và hấp thu sắt. Hấp gừng sả giữ mực mềm ngọt, không dầu. Món đổi vị hải sản giữa tuần cho đủ 25 loại thực phẩm."], [4, "Mồng tơi xào tỏi", "Mồng tơi, tỏi, dầu oliu", "100g", "150g", "200g", "Combo Magie ru ngủ: Mồng tơi giàu magie, canxi, chất nhầy tốt cho ruột. Xào tỏi nhanh. Rau tối chuẩn magie cho giấc ngủ sâu."], [4, "Canh rau dền đỏ nấu tôm khô", "Rau dền đỏ, tôm khô, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Sắt & Canxi: Rau dền đỏ là rau giàu canxi, magie, sắt hàng đầu — màu đỏ từ betalain chống oxy hoá. Tôm khô thêm canxi. Canh tối ưu tiên magie giúp con ngủ sâu, đúng khung giờ GH."], [4, "Đậu phụ non hấp hành gừng xì dầu", "Đậu phụ non, hành lá, gừng, xì dầu ít muối, dầu mè", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Isoflavone: Đậu phụ non mềm, dễ ăn, giàu đạm và canxi thực vật. Hấp với hành gừng, rưới xì dầu ít muối và vài giọt dầu mè — không dầu chiên, giữ nhẹ bụng. Hợp bé nhỏ và bữa tối."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Đạm hoàn chỉnh & Lutein: Trứng cung cấp đạm dễ tiêu, lutein và zeaxanthin bảo vệ mắt cho con học bài, xem bảng. Lòng đỏ giàu vitamin A, B12, selen hỗ trợ tăng trưởng và miễn dịch mùa gió mùa Đông Bắc. Nhai kỹ, ăn chậm để hấp thu tối đa."], [0, "Cháo tôm bí đỏ (tôm bóc vỏ băm nhỏ)", "Gạo tẻ, tôm tươi băm, bí đỏ nghiền, hành lá, dầu oliu 1 thìa", "1 bát", "1 bát đầy", "1.5 bát", "Canxi & Beta-caroten: Tôm cho canxi, kẽm, đạm trắng; bí đỏ cho beta-caroten, kali và magie. Cháo bí đỏ ngọt tự nhiên không cần đường, màu đẹp hấp dẫn bé nhỏ. Một thìa dầu oliu giúp hấp thu vitamin A."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi nguyên chất không đường", "180ml", "200ml", "240ml", "Canxi & Vitamin B2: Sữa tươi là 'kho canxi' tiện lợi nhất, kèm B2 giúp chuyển hoá năng lượng. Mùa gió mùa, hâm ấm sữa giúp con dễ uống và ấm bụng. Nhớ: toàn bộ sữa trong ngày hoàn thành trước 18h."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g)", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics tăng đề kháng: 70% hệ miễn dịch nằm ở đường ruột. Một hộp sữa chua mỗi sáng giúp con ít ốm vặt hơn khi gió mùa Đông Bắc về — bé ít ốm thì không bị 'đứt quãng' tăng trưởng. Là 1 đơn vị sữa trong lịch 5-6 đơn vị/ngày."], [1, "Lê (gọt vỏ, cắt miếng)", "Lê Hàn Quốc/lê Hà Giang chín giòn", "100g", "150g", "200g", "Chất xơ & Nước: Lê nhiều nước, ít đường, làm dịu cổ họng khi gió mùa khô hanh. Chất xơ hoà tan nuôi lợi khuẩn, giúp ruột hấp thu tốt. Kết hợp với sữa chua tạo bữa phụ nhẹ nhàng, đúng nguyên tắc no 70-80%."], [2, "Cơm trắng", "Gạo tẻ, nấu dẻo vừa", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Theo tỉ lệ 4-2-1, tinh bột là phần nhỏ nhất nhưng không thể thiếu ở bữa sáng và trưa. Lượng cơm theo tuổi bên cạnh; ưu tiên ăn đạm và rau trước, cơm sau để no 70-80% là dừng."], [2, "Thịt heo nạc vai luộc (thái mỏng, chấm nước mắm chanh loãng)", "Thịt nạc vai, hành, gừng, nước chấm pha thật loãng", "50g", "70g", "90g", "Đạm nạc & Vitamin B1: Thịt heo nạc là nguồn B1 cao nhất trong các loại thịt — B1 giúp chuyển hoá tinh bột thành năng lượng cho não. Luộc là cách chế biến không dầu, giữ đạm nguyên vẹn. Chấm nước mắm pha loãng để tránh mặn."], [2, "Đậu phụ kho nấm rơm (kho nhạt)", "Đậu phụ, nấm rơm, hành, tiêu, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & Beta-glucan: Đậu phụ kho với nấm rơm — đạm thực vật và beta-glucan tăng đề kháng. Kho nhạt, không chiên đậu trước. Góp phần 30% đạm thực vật mỗi ngày."], [2, "Canh cải bó xôi nấu tôm", "Cải bó xôi (rau chân vịt), tôm tươi, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Vitamin K2 & Magie & Sắt: Cải bó xôi là rau xanh đậm giàu K, magie, sắt, folate; tôm cho canxi, kẽm. Nấu nhanh giữ màu xanh. Đúng tiêu chí 'cải xanh đậm cấp K2' cho bữa tối."], [2, "Su su xào tỏi", "Su su, tỏi, dầu oliu", "100g", "150g", "200g", "Folate & Vitamin C: Su su mùa đông giòn ngọt, giàu folate, vitamin C, kali, ít calo. Xào tỏi nhanh. Bé thích vị ngọt giòn."], [2, "Cam vàng (bóc múi ăn tươi)", "Cam vàng/cam sành chín, ăn múi, không vắt bỏ bã", "100g", "150g", "200g", "Vitamin C & Flavonoid: Cam vàng đầu đông ngọt dịu, giàu vitamin C giúp tổng hợp collagen — 'khung xương mềm' để canxi bám vào. Ăn cả múi để giữ chất xơ, không ép lấy nước làm mất xơ và tăng đường nhanh. Ăn trong bữa phụ, trước 18h."], [2, "Phô mai (nhóm ≥10 tuổi)", "1 miếng phô mai 15g loại ít muối", "1 miếng", "1-2 miếng", "2 miếng", "Canxi cô đặc & K2: 15g phô mai cho ~100mg canxi và một lượng K2 đáng kể do quá trình lên men. Chọn loại ít muối vì ăn mặn làm mất canxi qua nước tiểu. Đây là đơn vị sữa thứ 4 trong ngày, dành cho tuổi dậy thì (từ 10 tuổi) cần 1000-1200mg canxi."], [3, "Sữa tươi không đường (mốc sữa cuối ngày)", "Sữa tươi nguyên chất không đường, có thể hâm ấm", "180ml", "200ml", "240ml", "Đạm & Canxi bù sau vận động: Sau giờ học thể dục/chạy nhảy, cơ và xương cần đạm + canxi để 'xây' lại. Sữa chiều đúng lúc này hấp thu tốt nhất. Tuyệt đối không dời sang buổi tối: sữa tối làm đường huyết tăng khi ngủ, ức chế GH."], [3, "Hạt macca (tách sẵn)", "Macca Đắk Lắk/Lâm Đồng, rang mộc không muối", "3-5 hạt", "5-8 hạt", "8-10 hạt", "Chất béo tốt & Mangan: Macca Tây Nguyên giàu chất béo không bão hoà đơn giúp hấp thu vitamin D3-K2 từ sữa, cùng mangan tham gia tổng hợp collagen sụn. Vị bùi, bé dễ ăn; hạn chế 5-10 hạt vì năng lượng cao."], [4, "Cơm — Linh hoạt theo cân nặng", "Gạo tẻ (có thể trộn gạo lứt). Dư cân: 4-2-0 bỏ cơm; chuẩn: ít cơm; thiếu cân: 1/2-1 bát", "Bỏ-1/2 bát", "1/2-1 bát", "1 bát", "Tinh bột tối — ít hoặc không: Buổi tối cơ thể không cần nhiều năng lượng nhanh; tinh bột dư thành mỡ, mỡ thừa tăng estrogen làm sụn đóng sớm. Hãy để đạm và rau 'làm chủ' bữa tối, cơm chỉ là phần phụ."], [4, "Cá nục kho cà chua (kho nhừ, nhạt)", "Cá nục tươi, cà chua, hành, tiêu, ít mắm", "60g", "80g", "100g", "Vitamin D3 & Canxi cá nhỏ: Cá nục là cá béo giá rẻ giàu D3, omega-3, canxi — kho nhừ có thể ăn cả xương mềm cho thêm canxi. Cà chua cho lycopene. Nêm nhạt, kho nhỏ lửa lâu thay vì mặn."], [4, "Cải ngồng xào tỏi", "Cải ngồng, tỏi, dầu oliu", "100g", "150g", "200g", "Vitamin K2 từ cải xanh đậm: Cải ngồng mùa đông Hà Nội giòn ngọt, giàu vitamin K, C, canxi, folate. Xào tỏi nhanh. Cấp K2 cho bữa tối."], [4, "Canh cua đồng rau đay mướp", "Cua đồng, rau đay, mướp, hành", "1 chén", "1 tô nhỏ", "1 tô vừa", "Combo Magie & Canxi: Cua đồng cho canxi tự nhiên cực cao; rau đay cho magie, canxi, chất nhầy tốt cho ruột. Canh tối chuẩn Bắc Bộ, ngủ ngon, xương chắc."], [4, "Đậu phụ hấp rắc mè rang hành lá", "Đậu phụ, mè rang, hành lá, xì dầu ít muối", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm thực vật & K2 từ mè: Đậu phụ hấp rắc mè rang — đạm thực vật + canxi + K2 trong một món nhẹ. Không chiên. Món phụ tối lý tưởng."]], "milk": ["Sáng 200ml sữa tươi (2 đv) + Phụ sáng 1 hộp sữa chua (1 đv) + Trưa 1 miếng phô mai (1 đv, nhóm ≥10 tuổi) + Phụ chiều 200ml sữa tươi (2 đv) = 5 đv (6-9 tuổi) / 6 đv (từ 10 tuổi) ✅ hoàn thành trước 18h", "5 đv / 6 đv / 6 đv", "Không sữa, sữa chua, phô mai, sữa hạt hay trái cây ở bữa tối. Mốc sữa cuối cùng là phụ chiều 15h30-16h. Nếu hôm nay con lỡ một mốc, bù vào mốc kế tiếp trước 18h — không bù buổi tối."], "water": ["Sáng dậy 1 cốc → Trước phụ sáng 1 cốc → Trưa 1-2 cốc → Chiều 2 cốc → Tối 1 cốc nhỏ (trước 20h)", "1.5-2 lít / 2-2.5 lít / 2-2.5 lít (tính chính xác theo cân nặng ở Mục lục)", "Nước lọc ấm ngày lạnh; đã gồm canh và sữa. Không nước ngọt, không nước ép đóng hộp. Uống đều, không dồn một lúc; cốc cuối trước 20h để không tiểu đêm làm gián đoạn giấc ngủ sâu."]}, {"m": [[0, "Trứng gà ta luộc", "1 quả trứng gà ta luộc chín kỹ", "1 quả", "1 quả", "2 quả", "Vitamin D3 từ lòng đỏ & Đạm chuẩn: Trứng gà ta là nguồn đạm có giá trị sinh học cao nhất trong tự nhiên, lòng đỏ chứa D3, K2, choline và lecithin — bộ ba giúp hấp thu canxi và nuôi não. Luộc là cách chế biến giữ trọn dưỡng chất, không thêm dầu mỡ. Bé vận động nhiều hoặc thiếu cân có thể dùng 2 quả."], [0, "Bánh cuốn nhân thịt mộc nhĩ (chấm nước mắm pha loãng)", "Bánh cuốn, thịt nạc băm, mộc nhĩ, hành phi, chả lụa, nước chấm pha loãng ít muối", "1 tô nhỏ", "1 tô vừa", "1 tô lớn", "Tinh bột gạo & Đạm nạc: Bánh cuốn hấp không dầu là món sáng nhẹ bụng, tinh bột gạo dễ tiêu, nhân thịt nạc + mộc nhĩ cho đạm và sắt. Pha nước chấm thật loãng, ít mắm — tránh mặn làm mất canxi. Kèm trứng luộc để đủ đạm."], [0, "Sữa tươi không đường (uống sau bữa ăn)", "Sữa tươi tiệt trùng/thanh trùng nguyên chất không đường, uống ấm", "180ml", "200ml", "240ml", "Canxi nguyên khối & Điện giải: 100ml sữa tươi cho ~120mg canxi ở dạng dễ hấp thu nhất cùng phốt-pho và đạm casein. Uống sau khi ăn sáng để canxi được hấp thu từ từ, không làm đầy bụng. Đây là mốc sữa đầu tiên trong ngày (2 đơn vị)."], [1, "Sữa chua không đường", "1 hộp sữa chua không đường (100g), để nguội bớt trước khi ăn", "1 hộp", "1 hộp", "1-2 hộp", "Probiotics: Lợi khuẩn Lactobacillus giúp ruột khoẻ — ruột khoẻ mới hấp thu được canxi, kẽm, sắt từ các bữa chính. Sữa chua còn cho ~110mg canxi và đạm dễ tiêu. Tính là 1 đơn vị sữa. Ăn kèm trái cây mùa để vitamin C hỗ trợ hấp thu khoáng chất."], [1, "Kiwi (bổ đôi, nạo thìa)", "Kiwi xanh hoặc vàng chín mềm", "1 quả", "1 quả", "1-2 quả", "Vitamin C & Actinidin: 1 quả kiwi cho hơn 100% nhu cầu vitamin C/ngày, hỗ trợ tổng hợp collagen và hấp thu sắt. Enzyme actinidin giúp tiêu hoá đạm của bữa sáng dễ dàng. Kiwi còn giàu vitamin K và kali — cặp đôi bảo vệ mật độ xương."], [2, "Cơm trắng (có thể trộn gạo lứt 1/3)", "Gạo tẻ ngon, nấu vừa chín tới; có thể trộn 1/3 gạo lứt", "1/2 bát", "1 bát", "1-1.5 bát", "Tinh bột chậm nuôi não: Tinh bột bữa trưa là BẮT BUỘC để não có glucose cho buổi học chiều — không bao giờ cắt. Trộn 1/3 gạo lứt giúp thêm magie, vitamin B1 và chất xơ, giải phóng đường chậm, bé không buồn ngủ sau ăn."], [2, "Thịt bò xào hành tây cần tây", "Thịt bò thăn, hành tây, cần tây, tỏi, dầu oliu", "50g", "70g", "90g", "Sắt Heme & Siêu Kẽm: Thịt bò cho sắt, kẽm, B12 — bộ ba tạo máu và kích GH. Cần tây cho vitamin K, kali; hành tây cho quercetin chống viêm. Xào nhanh, ít dầu, giữ bò mềm. Món sắt cho bé gái tuổi dậy thì."], [2, "Đậu phụ xào trứng hành lá (ít dầu)", "Đậu phụ, 1 quả trứng, hành lá, tiêu", "1/2 bìa", "1 bìa", "1 bìa rưỡi", "Đạm 70/30 & D3: Đậu phụ (thực vật) xào cùng trứng (động vật, D3) — tỉ lệ đạm cân đối trong một đĩa, ít dầu. Món nhanh cho bữa trưa ngày bận."], [2, "Canh khoai mỡ nấu tôm", "Khoai mỡ tím, tôm tươi băm, hành, ngò om", "1 chén", "1 tô nhỏ", "1 tô vừa", "Anthocyanin & Canxi: Khoai mỡ tím giàu anthocyanin, kali, xơ; tô
