name: Deploy API (Cloudflare)
# Deploys api/ to Cloudflare (Worker caovn-api + D1 caovn)
on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:
concurrency:
  group: api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; fi
      - name: Install wrangler
        run: npm i -g wrangler@4
      - name: Ensure D1 database
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="caovn") | .uuid')
          if [ -z "$ID" ]; then
            wrangler d1 create caovn
            ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="caovn") | .uuid')
          fi
          echo "D1 id: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute caovn --remote --command "CREATE TABLE IF NOT EXISTS kv (fam TEXT NOT NULL, k TEXT NOT NULL, v TEXT, t INTEGER NOT NULL, PRIMARY KEY (fam, k)); CREATE INDEX IF NOT EXISTS kv_fam_t ON kv (fam, t);"
      - name: Deploy worker
        run: wrangler deploy
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://caovn-api.linhizi.com/health; then echo; exit 0; fi
            sleep 10
          done
          echo "::warning::caovn-api.linhizi.com not reachable yet (DNS/cert may still be provisioning)"
